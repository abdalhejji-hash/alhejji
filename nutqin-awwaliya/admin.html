<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة المدير — تحدّي نُتقن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#13435A;--navy2:#17495A;--teal:#148E9D;--gold2:#BBAF87;--ice:#DDF1F3;--ink:#2B3A40;--muted:#5F7078;--bg:#F3F7F7;--ok:#1E8E5A;--bad:#B4380A;--line:#DCE6E8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.6}
button{font:inherit;cursor:pointer}
.top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top b{font-size:20px}.top small{display:block;color:var(--gold2);font-size:13px}
.top a,.top button{color:#fff;border:1px solid #5E8796;background:transparent;border-radius:10px;padding:6px 12px;font-size:14px;text-decoration:none;min-height:40px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--ice);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:28px;font-weight:700;color:var(--navy)}
.stat .k{font-size:13px;color:var(--muted)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
label{font-weight:600;font-size:14px}
input,select,textarea{font:inherit;padding:9px 11px;border:1.5px solid #C9D7DA;border-radius:10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;background:var(--navy);color:#fff;min-height:44px}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.red{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn.red.sure{background:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;min-height:36px}
.toggles{display:flex;flex-direction:column;gap:12px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tg .d{font-size:13px;color:var(--muted)}
.sw{position:relative;width:54px;height:30px;flex:none;border-radius:15px;border:0;background:#C9D7DA}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:right .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{right:27px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters .g{display:flex;gap:6px}
.filters .g button{border:1.5px solid #C9D7DA;background:#fff;border-radius:10px;padding:6px 12px;font-weight:600;color:var(--navy);min-height:40px}
.filters .g button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.filters input{flex:1;min-width:160px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th{background:var(--teal);color:#fff;padding:8px;text-align:right;font-weight:700;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #E3ECEE;vertical-align:middle}
td.n{font-weight:700;color:var(--navy)}
td.act{white-space:nowrap}
td.act .btn{margin-inline-start:4px}
.msg{min-height:1.4em;font-size:14px;margin-top:6px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
.login{max-width:380px;margin:40px auto}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:16px}
.edit{display:flex;gap:6px}
.edit input,.edit select{padding:5px 8px;min-width:120px}
</style>
</head>
<body>
<header class="top">
<div><b>لوحة المدير — تحدّي نُتقن</b><small>مدرسة حكيم بن حزام الابتدائية وملحقتها الطريبيل المتوسطة • الصفوف الأوّلية</small></div>
<div id="tb"></div>
</header>
<main class="wrap" id="app"></main>
<script>
const API = "__API__";
const STAGE = "primary";
const STUDENT_URL = "./";
const GRADES = [['1','الأول'],['2','الثاني'],['3','الثالث']];
const GNAME = Object.fromEntries(GRADES);
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = document.getElementById('app'), tb = document.getElementById('tb');
const linked = () => API && API.indexOf('__') !== 0;
let PIN = '';
try{ PIN = sessionStorage.getItem('nq_pin') || ''; }catch(e){}
let D = null, F = {g:'all', q:''}, EDIT = null;

async function call(op, extra){
  const r = await fetch(API, {method:'POST', body: JSON.stringify(Object.assign({pin:PIN, op, stage:STAGE}, extra || {}))});
  return r.json();
}
const ERR = {'wrong pin':'كلمة المرور غير صحيحة.','locked':'محاولات خاطئة كثيرة، انتظر ١٠ دقائق.','no pin':'لم تُكتب كلمة المرور في الكود بعد (ADMIN_PIN).'};

function login(msg){
  tb.innerHTML = '<a href="' + STUDENT_URL + '">صفحة الطلاب</a>';
  if(!linked()){
    app.innerHTML = '<div class="card login"><h2>اللوحة غير مربوطة بعد</h2><p class="muted">تعمل لوحة المدير بعد ربط الموقع بجدول قوقل.</p></div>';
    return;
  }
  app.innerHTML = '<form class="card login" id="lf"><h2>دخول المدير</h2><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"><div class="msg err" id="m">' + (msg || '') + '</div><button class="btn" style="width:100%;margin-top:8px">دخول</button></form>';
  document.getElementById('pw').focus();
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    PIN = document.getElementById('pw').value.trim();
    const m = document.getElementById('m'); m.textContent = 'جارٍ التحقق…'; m.className = 'msg';
    try{
      const j = await call('login');
      if(!j.ok){ m.textContent = ERR[j.error] || 'تعذّر الدخول.'; m.className = 'msg err'; return; }
      try{ sessionStorage.setItem('nq_pin', PIN); }catch(e){}
      load();
    }catch(err){ m.textContent = 'تعذّر الاتصال بالجدول.'; m.className = 'msg err'; }
  };
}
function logout(){ PIN = ''; try{ sessionStorage.removeItem('nq_pin'); }catch(e){} login(); }

async function load(note){
  app.innerHTML = '<div class="card empty">جارٍ التحميل…</div>';
  try{
    const j = await call('list');
    if(!j.ok){ if(j.error === 'wrong pin' || j.error === 'no pin' || j.error === 'locked') return login(ERR[j.error]); throw 0; }
    D = j; render(note);
  }catch(e){ app.innerHTML = '<div class="card empty">تعذّر التحميل. <button class="btn sm" id="rt">إعادة المحاولة</button></div>'; document.getElementById('rt').onclick = () => load(); }
}

function fmtTime(t){ if(!t) return '—'; const d = new Date(t); return d.toLocaleDateString('ar-SA-u-ca-gregory', {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString('ar-SA', {hour:'numeric', minute:'2-digit'}); }

function render(note){
  tb.innerHTML = '<a href="' + STUDENT_URL + '" target="_blank" rel="noopener">صفحة الطلاب</a> <button id="lo">خروج</button>';
  document.getElementById('lo').onclick = logout;
  const S = D.settings, all = D.students;
  let list = all.filter(s => (F.g === 'all' || s.grade === F.g) && (!F.q || s.name.includes(F.q) || s.cls.includes(F.q)));
  list.sort((a,b) => a.grade.localeCompare(b.grade) || b.points - a.points);
  const sw = (id, on, t, d) => '<div class="tg"><div><b>' + t + '</b><div class="d">' + d + '</div></div><button class="sw" id="' + id + '" role="switch" aria-checked="' + on + '" aria-label="' + t + '"></button></div>';
  app.innerHTML =
    '<div class="card"><div class="stats">' +
      '<div class="stat"><div class="v">' + AR(all.length) + '</div><div class="k">طالب مشارك</div></div>' +
      '<div class="stat"><div class="v">' + AR(D.attempts) + '</div><div class="k">جولة محلولة</div></div>' +
      '<div class="stat"><div class="v">' + AR(D.attemptsToday) + '</div><div class="k">جولة اليوم</div></div>' +
      '<div class="stat"><div class="v">' + AR(all.length ? Math.round(all.reduce((a,s) => a + s.points, 0) / all.length) : 0) + '</div><div class="k">متوسط النقاط</div></div>' +
    '</div></div>' +
    '<div class="card"><h2>التحكم في الموقع</h2><div class="toggles">' +
      sw('s_open', S.open, 'التحدّي مفتوح للطلاب', 'عند الإيقاف لا يستطيع الطلاب حل الجولات، وتبقى لوحة الشرف ظاهرة.') +
      sw('s_board', S.board, 'إظهار لوحة الشرف', 'عند الإخفاء لا تظهر الأسماء والترتيب للطلاب.') +
      '<div class="tg" style="flex-direction:column;align-items:stretch"><label for="s_msg">رسالة تظهر للطلاب أعلى الصفحة (اتركها فارغة لإخفائها)</label><textarea id="s_msg" rows="2" maxlength="200">' + esc(S.msg) + '</textarea><div><button class="btn sm" id="s_save">حفظ الرسالة</button></div></div>' +
    '</div><div class="msg" id="sm"></div></div>' +
    '<div class="card"><h2>الطلاب المشاركون</h2>' +
      '<div class="filters"><div class="g">' + [['all','الكل']].concat(GRADES).map(g => '<button data-g="' + g[0] + '" class="' + (F.g === g[0] ? 'on' : '') + '">' + g[1] + '</button>').join('') + '</div>' +
      '<input id="q" placeholder="بحث بالاسم أو الفصل" value="' + esc(F.q) + '"><button class="btn alt sm" id="csv">تحميل Excel (CSV)</button><button class="btn alt sm" id="rf">تحديث</button></div>' +
      '<div class="msg ok" id="lm">' + (note || '') + '</div>' +
      (list.length ? '<div class="tbl"><table><thead><tr><th>الاسم</th><th>الصف</th><th>الفصل</th><th>الجولات</th><th>النقاط</th><th>آخر نشاط</th><th>إجراء</th></tr></thead><tbody>' +
        list.map((s, i) => {
          const key = s.grade + '|' + s.name;
          if(EDIT && EDIT.key === key){
            return '<tr><td colspan="7"><div class="edit">' + (EDIT.what === 'name'
              ? '<input id="ed" value="' + esc(s.name) + '" aria-label="الاسم الجديد">'
              : '<select id="ed" aria-label="الفصل الجديد">' + [1,2,3,4].map(n => AR(s.grade) + '/' + AR(n)).map(o => '<option' + (o === s.cls ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>') +
              '<button class="btn sm" id="es">حفظ</button><button class="btn alt sm" id="ec">إلغاء</button></div></td></tr>';
          }
          return '<tr><td class="n">' + esc(s.name) + '</td><td>' + GNAME[s.grade] + '</td><td>' + esc(s.cls) + '</td><td>' + AR(s.rounds) + '</td><td>' + AR(s.points) + '</td><td>' + fmtTime(s.last) + '</td>' +
            '<td class="act"><button class="btn alt sm" data-a="name" data-k="' + esc(key) + '">تعديل الاسم</button><button class="btn alt sm" data-a="cls" data-k="' + esc(key) + '">الفصل</button><button class="btn red sm" data-a="del" data-k="' + esc(key) + '">حذف</button></td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">لا يوجد طلاب' + (F.q || F.g !== 'all' ? ' بهذا البحث' : ' بعد') + '.</div>') +
    '</div>';
  // الإعدادات
  const sm = document.getElementById('sm');
  async function saveSet(patch, okText){
    sm.textContent = 'جارٍ الحفظ…'; sm.className = 'msg';
    try{ const j = await call('settings', patch); if(!j.ok) throw 0; D.settings = j.settings; render(); const m2 = document.getElementById('sm'); m2.textContent = okText; m2.className = 'msg ok'; }
    catch(e){ sm.textContent = 'تعذّر الحفظ.'; sm.className = 'msg err'; }
  }
  document.getElementById('s_open').onclick = () => saveSet({open: !S.open}, S.open ? 'أُوقف التحدّي.' : 'فُتح التحدّي للطلاب.');
  document.getElementById('s_board').onclick = () => saveSet({board: !S.board}, S.board ? 'أُخفيت لوحة الشرف.' : 'أصبحت لوحة الشرف ظاهرة.');
  document.getElementById('s_save').onclick = () => saveSet({msg: document.getElementById('s_msg').value.trim()}, 'حُفظت الرسالة.');
  // الفلاتر
  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { F.g = b.dataset.g; EDIT = null; render(); });
  const q = document.getElementById('q');
  q.oninput = () => { F.q = q.value.trim(); const pos = q.selectionStart; render(); const q2 = document.getElementById('q'); q2.focus(); q2.setSelectionRange(pos, pos); };
  document.getElementById('rf').onclick = () => load();
  document.getElementById('csv').onclick = () => {
    const rows = [['الاسم','الصف','الفصل','الجولات','النقاط','عدد المحاولات']].concat(list.map(s => [s.name, GNAME[s.grade], s.cls, s.rounds, s.points, s.attempts]));
    const csv = '﻿' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'نتائج_تحدي_نتقن.csv'; a.click();
  };
  // الإجراءات
  const find = key => D.students.find(s => s.grade + '|' + s.name === key);
  app.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const s = find(b.dataset.k); if(!s) return;
    if(b.dataset.a === 'del'){
      if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent = 'تأكيد الحذف'; setTimeout(() => { if(b.isConnected){ b.classList.remove('sure'); b.textContent = 'حذف'; } }, 4000); return; }
      b.disabled = true; b.textContent = 'جارٍ الحذف…';
      try{ const j = await call('delete', {grade:s.grade, name:s.name}); if(!j.ok) throw 0; load('حُذف «' + s.name + '» (' + AR(j.removed) + ' جولة).'); }
      catch(e){ b.textContent = 'تعذّر'; }
      return;
    }
    EDIT = {key: b.dataset.k, what: b.dataset.a}; render();
    const ed = document.getElementById('ed'); ed.focus();
    document.getElementById('ec').onclick = () => { EDIT = null; render(); };
    document.getElementById('es').onclick = async () => {
      const v = ed.value.replace(/\s+/g, ' ').trim();
      if(EDIT.what === 'name' && v.length < 3) return;
      const btn = document.getElementById('es'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
      try{
        const j = EDIT.what === 'name' ? await call('rename', {grade:s.grade, name:s.name, to:v}) : await call('setcls', {grade:s.grade, name:s.name, cls:v});
        if(!j.ok) throw 0;
        EDIT = null; load(EDIT === null ? 'حُفظ التعديل.' : '');
      }catch(e){ btn.disabled = false; btn.textContent = 'تعذّر، أعد المحاولة'; }
    };
  });
}

if(PIN && linked()) load(); else login();
</script>
</body>
</html>
