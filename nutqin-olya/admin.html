<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة المعلم — تحدّي نُتقن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#13435A;--navy2:#17495A;--teal:#148E9D;--gold:#A99C6E;--gold2:#BBAF87;--ice:#DDF1F3;--ink:#22303A;--muted:#5F7078;--bg:#F5F7FA;--line:#E3E8EF;--ok:#1E8E5A;--okbg:#E7F6EE;--bad:#B4380A;--org:#C2410C;--orgbg:#FFF1E6;--vio:#4B3BA8;--viobg:#EEEBFB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.6;background-image:linear-gradient(#EEF1F6 1px,transparent 1px),linear-gradient(90deg,#EEF1F6 1px,transparent 1px);background-size:28px 28px}
button,a.btn{font:inherit;cursor:pointer}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:26px;border:3px solid var(--teal);display:flex;align-items:center;justify-content:center;background:var(--ice)}
.brand b{font-size:22px;color:var(--navy);display:block;line-height:1.2}.brand b span{color:var(--org)}
.brand small{color:var(--teal);font-size:13px;font-weight:600}
.who{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy)}
.who button{border:1px solid var(--line);background:#fff;color:var(--vio);border-radius:12px;padding:6px 16px;min-height:40px}
.page{max-width:1240px;margin:0 auto;padding:22px 20px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.page{grid-template-columns:minmax(0,1fr);padding:14px 12px}.side{position:static;order:2}.bar{padding:10px 12px}.brand small{display:none}.hero h1{font-size:21px}}
.side{background:var(--navy);color:#fff;border-radius:24px;padding:20px;position:sticky;top:16px}
.side h3{margin:0 0 12px;font-size:19px}
.ini{display:block;width:100%;text-align:right;background:#fff;color:var(--ink);border:0;border-radius:16px;padding:14px;margin-bottom:10px}
.ini b{display:block;font-size:16px;color:var(--navy)}.ini small{color:var(--muted);display:block}
.ini .tag{display:inline-block;margin-top:6px;background:var(--orgbg);color:var(--org);border-radius:999px;padding:0 10px;font-size:12px;font-weight:700}
.ini.dim{background:transparent;border:1.5px dashed #5E8796;color:#fff;text-align:center;font-weight:700}
.ini.dim small{color:var(--gold2)}
.side p{color:#C9DDE3;font-size:13px;margin:14px 0 0}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:18px}
.hero{display:flex;gap:18px;align-items:flex-start}
.hero .main{flex:1;min-width:0}
.qr{width:140px;flex:none;border:1px solid var(--line);border-radius:18px;padding:10px;background:#fff}
.qr img{width:100%;display:block}
@media(max-width:640px){.hero{flex-direction:column-reverse;align-items:stretch}.qr{width:120px;align-self:center}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.c-org{background:var(--orgbg);color:var(--org)}.c-vio{background:var(--viobg);color:var(--vio)}.c-ok{background:var(--okbg);color:var(--ok)}.c-bad{background:#FDECEA;color:var(--bad)}
.hero h1{margin:0 0 10px;font-size:26px;color:var(--navy);line-height:1.35}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--viobg);border-radius:14px;padding:8px 8px 8px 14px;direction:rtl}
.link code{min-width:0;flex:1;font-family:inherit;font-weight:700;color:var(--vio);direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.link button{flex:none;background:#fff;border:0;border-radius:10px;padding:6px 14px;font-weight:700;color:var(--vio);min-height:40px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act{border:0;border-radius:12px;padding:7px 14px;font-weight:700;font-size:14px;text-decoration:none;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.a-wa{background:var(--okbg);color:var(--ok)}.a-qr{background:#E8F1FD;color:#1E5BB8}.a-st{background:var(--viobg);color:var(--vio)}.a-hb{background:var(--orgbg);color:var(--org)}.a-off{background:#EEF1F4;color:#4A5560}.a-on{background:var(--ok);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center}
.stat .v{font-size:30px;font-weight:700;line-height:1.2}
.stat .k{color:var(--muted);font-size:14px}
.v1{color:var(--vio)}.v2{color:var(--org)}.v3{color:var(--ok)}.v4{color:#1E5BB8}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{margin:0;font-size:21px;color:var(--navy)}
.muted{color:var(--muted);font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-weight:700;color:var(--navy);min-height:40px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rd.now{border-color:#A99C6E!important}.champ{background:#13435A;color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:8px}.champ small{color:#BBAF87}.q .sj{font-size:12px;color:#148E9D;font-weight:700}
.rounds{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.rd{flex:none;width:62px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px 0;text-align:center;min-height:62px}
.rd b{display:block;font-size:19px;color:var(--navy)}.rd small{font-size:11px;color:var(--muted)}
.rd.on{background:var(--org);border-color:var(--vio);border-width:2.5px;color:#fff}.rd.on b,.rd.on small{color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.ind{background:var(--viobg);border-radius:16px;padding:12px 16px;margin-bottom:12px}
.ind .k{color:var(--vio);font-size:13px;font-weight:700}.ind .v{font-weight:600}
.q{border-top:1px solid var(--line);padding:12px 0}
.q .n{display:inline-flex;width:28px;height:28px;border-radius:14px;background:var(--viobg);color:var(--vio);align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-left:8px}
.q .st{font-weight:700}
.q .ctx{font-size:13px;color:var(--muted);background:#FBF9F2;border-radius:10px;padding:6px 10px;margin:6px 0}
.q img{max-height:90px;border-radius:8px;display:block;margin:6px 0}
.q .ops{font-size:14px;color:var(--muted);margin-top:4px}
.q .ops .y{color:var(--ok);font-weight:700}
.top li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.top ol{list-style:none;padding:0;margin:0}
.medal{display:inline-flex;width:26px;height:26px;border-radius:13px;align-items:center;justify-content:center;color:#fff;font-size:13px;margin-left:8px;background:#9AA7AE}
.m1{background:#C9A227}.m2{background:#8C9AA0}.m3{background:#B0703A}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.exp{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.exp button{border:0;border-radius:12px;padding:7px 14px;font-weight:700;font-size:14px;min-height:40px}
.e-pdf{background:var(--viobg);color:var(--vio)}.e-xl{background:var(--okbg);color:var(--ok)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.sw{position:relative;width:54px;height:30px;flex:none;border-radius:15px;border:0;background:#C9D7DA}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:right .15s}
.sw[aria-checked="true"]{background:var(--ok)}.sw[aria-checked="true"]::after{right:27px}
textarea,input,select{font:inherit;padding:9px 11px;border:1.5px solid #C9D7DA;border-radius:12px;background:#fff;width:100%}
textarea:focus,input:focus,select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.btn{border:0;border-radius:12px;padding:8px 16px;font-weight:700;background:var(--navy);color:#fff;min-height:42px}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.red{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}.btn.red.sure{background:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;min-height:36px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:700px}
th{background:var(--navy);color:#fff;padding:9px;text-align:right;font-weight:700;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{font-weight:700;color:var(--navy)}td.act{white-space:nowrap}td.act .btn{margin-inline-start:4px}
.edit{display:flex;gap:6px}.edit input,.edit select{min-width:140px;padding:5px 8px}
.msg{min-height:1.4em;font-size:14px;margin-top:6px}.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
.login{max-width:400px;margin:60px auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:8px 18px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.print{display:none}
@media print{
  body{background:#fff}.bar,.side,.noprint,.toast{display:none!important}.page{display:block;padding:0}
  .card,.stat{border-color:#ccc;break-inside:avoid}.print{display:block}
}

const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

const STARTS = DATA.starts;
function weekIndex(){ const now = Date.now(); let idx = -1; STARTS.forEach((s, i) => { if(now >= Date.parse(s + 'T00:00:00+03:00')) idx = i; }); return idx; }
const FMT = new Intl.DateTimeFormat('ar-SA-u-ca-gregory', {day:'numeric', month:'short', timeZone:'Asia/Riyadh'});
const fmtD = s => FMT.format(new Date(s + 'T12:00:00+03:00'));
let D = null, V = {g:'1', w:Math.max(0, weekIndex()), tg:'all', q:''}, EDIT = null;
// مجموع المحاولات الأولى في نماذج الأسابيع
const wks = s => s.weeks || {};
const wsum = s => Object.values(wks(s)).reduce((a, x) => a + x[0], 0);
const wn = s => Object.keys(wks(s)).length;
const wfull = s => Object.values(wks(s)).filter(x => x[0] >= 100).length;
const DAYS = g => DATA.grades[g].days || null;
function weekOfDate(date){ let idx = -1; STARTS.forEach((s, i) => { if(date >= s) idx = i; }); return idx; }
// درجة الطالب في أسبوع: نموذج الأسبوع أو مجموع مجموعات الأيام [الدرجة، الثواني، العدد]
function ws(s, w){
  let sc = 0, se = 0, n = 0;
  Object.keys(wks(s)).forEach(k => {
    let kw = +k;
    if(k[0] === 'd'){ const d = (DAYS(s.grade) || [])[+k.slice(1) - 1]; kw = d ? weekOfDate(d.date) + 1 : 0; }
    if(kw === w){ sc += wks(s)[k][0]; se += wks(s)[k][1]; n++; }
  });
  return n ? [sc, se, n] : null;
}

function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }
async function call(op, extra){

}
const ERR = {'wrong pin':'كلمة المرور غير صحيحة.','locked':'محاولات خاطئة كثيرة، انتظر ١٠ دقائق.','no pin':'أنشئ كلمة المرور أولًا.'};

// ===== الدخول =====
async function login(msg){
  who.innerHTML = '';
  if(!linked()){ root.innerHTML = '<div class="card login"><h2>اللوحة غير مربوطة بعد</h2><p class="muted">تعمل لوحة المعلم بعد ربط الموقع بجدول قوقل.</p></div>'; return; }
  let setup = false;
  try{ const st = await call('status'); setup = !!(st && st.setup); }catch(e){ root.innerHTML = '<div class="card login"><h2>تعذّر الاتصال بالجدول</h2><p class="muted">تأكد من الإنترنت ثم حدّث الصفحة.</p></div>'; return; }
  if(setup){
    root.innerHTML = '<form class="card login" id="sf"><h2 style="margin-top:0;color:#13435A">إنشاء كلمة مرور المعلم</h2><p class="muted">هذه أول مرة تفتح فيها اللوحة. اختر كلمة مرور (٦ أحرف أو أرقام على الأقل) واحفظها عندك.</p><label for="p1">كلمة المرور</label><input id="p1" type="password" autocomplete="new-password"><label for="p2" style="display:block;margin-top:8px">أعد كتابتها</label><input id="p2" type="password" autocomplete="new-password"><div class="msg err" id="m"></div><button class="btn" style="width:100%;margin-top:8px">حفظ ودخول</button></form>';
    document.getElementById('p1').focus();
    document.getElementById('sf').onsubmit = async e => {
      e.preventDefault();
      const a1 = document.getElementById('p1').value.trim(), a2 = document.getElementById('p2').value.trim(), m = document.getElementById('m');
      if(a1.length < 6){ m.textContent = 'كلمة المرور قصيرة، اكتب ٦ أحرف أو أرقام على الأقل.'; return; }
      if(a1 !== a2){ m.textContent = 'الكلمتان غير متطابقتين.'; return; }
      m.textContent = 'جارٍ الحفظ…'; m.className = 'msg';
      try{ const j = await call('setup', {newPin: a1}); if(!j.ok) throw 0; PIN = a1; try{ sessionStorage.setItem('nq_pin', PIN); }catch(e){} load('أُنشئت كلمة المرور'); }
      catch(err){ m.textContent = 'تعذّر الحفظ.'; m.className = 'msg err'; }
    };
    return;
  }
  root.innerHTML = '<form class="card login" id="lf"><h2 style="margin-top:0;color:#13435A">دخول المعلم</h2><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"><div class="msg err" id="m">' + (msg || '') + '</div><button class="btn" style="width:100%;margin-top:8px">دخول</button></form>';
  document.getElementById('pw').focus();
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    PIN = document.getElementById('pw').value.trim();
    const m = document.getElementById('m'); m.textContent = 'جارٍ التحقق…'; m.className = 'msg';
    try{
      const j = await call('login');
      if(!j.ok){ m.textContent = ERR[j.error] || 'تعذّر الدخول.'; m.className = 'msg err'; return; }
      try{ sessionStorage.setItem('nq_pin', PIN); }catch(e){}
      load();
    }catch(err){ m.textContent = 'تعذّر الاتصال بالجدول.'; m.className = 'msg err'; }
  };
}
function logout(){ PIN = ''; try{ sessionStorage.removeItem('nq_pin'); }catch(e){} login(); }
async function load(note){
  if(!D) root.innerHTML = '<div class="card empty" style="max-width:600px;margin:40px auto">جارٍ التحميل…</div>';
  try{
    const j = await call('list');
    if(!j.ok){ if(ERR[j.error]) return login(ERR[j.error]); throw 0; }
    D = j; D.roundStats = D.roundStats || {}; render(); if(note) toast(note);
  }catch(e){ root.innerHTML = '<div class="card empty" style="max-width:600px;margin:40px auto">تعذّر التحميل. <button class="btn sm" id="rt">إعادة المحاولة</button></div>'; document.getElementById('rt').onclick = () => load(); }
}

function rank(list){ return list.slice().sort((a,b) => wsum(b) - wsum(a) || wn(b) - wn(a) || a.name.localeCompare(b.name,'ar')); }
function weekRank(list, w){ return list.filter(s => ws(s, w)).sort((a,b) => ws(b, w)[0] - ws(a, w)[0] || ws(a, w)[1] - ws(b, w)[1] || a.name.localeCompare(b.name,'ar')); }
const medal = i => '<span class="medal ' + (i < 3 ? 'm' + (i+1) : '') + '">' + AR(i+1) + '</span>';
function fmtTime(t){ if(!t) return '—'; const d = new Date(t); return d.toLocaleDateString('ar-SA-u-ca-gregory', {day:'numeric', month:'short'}) + ' • ' + d.toLocaleTimeString('ar-SA', {hour:'numeric', minute:'2-digit'}); }

  const SIDE = sideHTML(S);
  const gStudents = all.filter(s => s.grade === V.g);
  const wi = weekIndex(), W = DATA.grades[V.g].weeks, wk = V.w + 1;
  const wkList = weekRank(gStudents, wk);
  const curAll = all.filter(s => ws(s, Math.max(1, wi + 1)));
  const totalFull = all.reduce((a, s) => a + wfull(s), 0);
  const avg = curAll.length ? Math.round(curAll.reduce((a, s) => { const x = ws(s, Math.max(1, wi + 1)); return a + x[0] / x[2]; }, 0) / curAll.length) : 0;
  const wAvg = wkList.length ? Math.round(wkList.reduce((a, s) => { const x = ws(s, wk); return a + x[0] / x[2]; }, 0) / wkList.length) : 0;

  let h = '<div class="page">' + SIDE + '<main>';
  // البطاقة الرئيسية
  h += '<div class="card"><div class="hero"><div class="main">' +
    '<div class="chips"><span class="chip c-org">المواد الأربع</span><span class="chip c-vio">الصفوف العليا (٤–٦)</span>' + (S.open ? '<span class="chip c-ok">● مفتوحة لطلابك</span>' : '<span class="chip c-bad">● موقوفة</span>') + (S.board ? '' : '<span class="chip c-bad">لوحة الشرف مخفية</span>') + '</div>' +
    '<h1>تحدّي نُتقن — مدرسة حكيم بن حزام</h1>' +
    '<div class="link"><code>' + esc(STUDENT_URL.replace('https://','')) + '</code><button id="cp">📋 نسخ</button></div>' +
    '<div class="acts noprint">' +
      '<a class="act a-wa" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent('تحدّي نُتقن للصفوف العليا — مدرسة حكيم بن حزام الابتدائية وملحقتها الطريبيل المتوسطة\nنموذج جديد كل أسبوع في لغتي والرياضيات والعلوم والدراسات الإسلامية، وتكريم للمركز الأول في كل صف.\nادخل واختر صفك واكتب اسمك الثلاثي:\n' + STUDENT_URL) + '">واتساب</a>' +
      '<a class="act a-qr" href="qr.png" download="رمز_تحدي_نتقن.png">تحميل QR</a>' +
      '<a class="act a-st" href="' + STUDENT_URL + '" target="_blank" rel="noopener">👁 صفحة الطالب</a>' +
      '<a class="act a-hb" href="' + STUDENT_URL + '#board" target="_blank" rel="noopener">🏅 لوحة الشرف</a>' +
      '<button class="act ' + (S.open ? 'a-off' : 'a-on') + '" id="tgl">' + (S.open ? 'إيقاف المبادرة' : 'تشغيل المبادرة') + '</button>' +
    '</div></div><div class="qr"><img src="qr.png" alt="رمز QR لرابط الطلاب"></div></div></div>';
  // الإحصاءات
  h += '<div class="stats">' +
    '<div class="stat"><div class="v v1">' + AR(all.length) + '</div><div class="k">طالبًا مشاركًا</div></div>' +
    '<div class="stat"><div class="v v2">' + AR(avg) + '</div><div class="k">متوسط نموذج هذا الأسبوع من ١٠٠</div></div>' +
    '<div class="stat"><div class="v v3">' + AR(totalFull) + '</div><div class="k">درجة كاملة</div></div>' +
    '<div class="stat"><div class="v v4">' + AR(D.attemptsToday) + '</div><div class="k">محاولة اليوم • ' + AR(D.attempts) + ' منذ البداية</div></div>' +
  '</div>';
  // نماذج الأسابيع
  h += '<div class="card"><div class="sec-h"><h2>نماذج الأسابيع</h2><span class="muted">نموذج جديد كل أحد • ١٢ سؤالًا (٣ لكل مادة) • تُحتسب المحاولة الأولى للتكريم</span></div>' +
    '<div class="seg">' + GRADES.map(g => '<button data-g="' + g[0] + '" class="' + (g[0] === V.g ? 'on' : '') + '">الصف ' + g[1] + '</button>').join('') + '</div>' +
    '<div class="rounds">' + W.map((_, i) => { const n = gStudents.filter(s => ws(s, i+1)).length; const tag = i === wi ? 'الآن' : i < wi ? (n ? AR(n) + ' طالب' : 'انتهى') : 'جاهز'; return '<button class="rd' + (i === V.w ? ' on' : '') + (i === wi ? ' now' : '') + '" data-w="' + i + '"><b>' + AR(i+1) + '</b><small>' + tag + '</small></button>'; }).join('') + '</div>' +
    '<div class="two"><div>' +
      '<div class="ind"><div class="k">📌 الصف ' + GNAME[V.g] + ' • نموذج الأسبوع ' + AR(wk) + (V.w === wi ? ' (الحالي)' : '') + '</div><div class="v">من الأحد ' + fmtD(STARTS[V.w]) + (STARTS[V.w+1] ? ' إلى ' + fmtD(STARTS[V.w+1]) : '') + '</div>' +
      '<div class="muted">' + (wkList.length ? 'حلّه ' + AR(wkList.length) + ' طالبًا • المتوسط ' + AR(wAvg) + ' من ١٠٠ • ' + AR(wkList.filter(s => ws(s, wk)[0] >= 100 * ws(s, wk)[2]).length) + ' درجة كاملة' : 'لم يحلّه أحد بعد') + '</div></div>' +
      (DAYS(V.g) ? DAYS(V.g).filter(d => weekOfDate(d.date) === V.w) : [{date:'', q:W[V.w]}]).map(d => (d.date ? '<h3 style="color:#13435A;margin:12px 0 4px">📅 مجموعة ' + new Intl.DateTimeFormat('ar-SA-u-ca-gregory', {weekday:'long', day:'numeric', month:'long', timeZone:'Asia/Riyadh'}).format(new Date(d.date + 'T12:00:00+03:00')) + '</h3>' : '') + d.q.map((q, i) => { const sec = (DATA.grades[V.g].secs[q.s] || [])[q.sec]; return '<div class="q"><span class="n">' + AR(i+1) + '</span><span class="sj">' + SNAME[q.s] + (q.t ? ' • ' + esc(q.t) : sec ? ' • ' + esc(sec[0]) : '') + '</span><br><span class="st">' + esc(q.stem) + '</span>' +
        (q.ctx && q.ctx.length ? '<div class="ctx">' + esc(q.ctx.join(' ')).slice(0, 260) + (q.ctx.join(' ').length > 260 ? '…' : '') + '</div>' : '') +
        (q.img ? '<img src="' + q.img + '" alt="صورة السؤال">' : '') +
        '<div class="ops">' + q.opts.map((o, j) => '<span class="' + (j === q.ans ? 'y' : '') + '">' + L[j] + ') ' + esc(o) + (j === q.ans ? ' ✓' : '') + '</span>').join('&nbsp;&nbsp; ') + '</div></div>'; }).join('')).join('') + (DAYS(V.g) && !DAYS(V.g).some(d => weekOfDate(d.date) === V.w) ? '<div class="empty">لم تُجهَّز مجموعات هذا الأسبوع بعد.</div>' : '') +
    '</div><div>' +
      '<div class="sec-h"><h2>🏅 أبطال الأسبوع ' + AR(wk) + ' — الصف ' + GNAME[V.g] + '</h2></div>' +
      (wkList.length ? '<div class="champ">بطل الأسبوع: <b>' + esc(wkList[0].name) + '</b> <small>' + AR(ws(wkList[0], wk)[0]) + ' من ' + AR(100 * ws(wkList[0], wk)[2]) + '</small></div><div class="top"><ol>' + wkList.slice(0, 10).map((s, i) => '<li><span>' + medal(i) + esc(s.name) + '</span><b>' + AR(ws(s, wk)[0]) + ' <small class="muted">' + AR(Math.floor(ws(s, wk)[1]/60)) + 'د' + AR(ws(s, wk)[1]%60) + 'ث</small></b></li>').join('') + '</ol></div>' : '<div class="empty">لم يحلّ أحد هذا النموذج بعد.<br>أرسل الرابط لطلابك ليبدؤوا.</div>') +
      '<div class="muted" style="margin:6px 0">عند التساوي يتقدّم الأسرع في الحل.</div>' +
      '<div class="exp noprint"><button class="e-pdf" id="pdf">📄 تقرير PDF</button><button class="e-xl" id="xw">📊 Excel هذا الأسبوع</button><button class="e-xl" id="xa">📊 Excel كل الأسابيع</button></div>' +
    '</div></div></div>';
  // الطلاب
  let list = all.filter(s => (V.tg === 'all' || s.grade === V.tg) && (!V.q || s.name.includes(V.q) || s.cls.includes(V.q)));
  list = list.slice().sort((a,b) => a.grade.localeCompare(b.grade) || wsum(b) - wsum(a));
  h += '<div class="card"><div class="sec-h"><h2>👥 الطلاب (' + AR(all.length) + ')</h2><span class="muted">«تعديل» يغيّر الاسم في كل النتائج ولوحة الشرف • «حذف» يزيل الطالب ونتائجه</span></div>' +
    '<div class="seg noprint">' + [['all','الكل']].concat(GRADES).map(g => '<button data-tg="' + g[0] + '" class="' + (g[0] === V.tg ? 'on' : '') + '">' + g[1] + '</button>').join('') + '</div>' +
    '<input class="noprint" id="q" placeholder="بحث بالاسم" value="' + esc(V.q) + '" style="margin-bottom:10px">' +
    (list.length ? '<div class="tbl"><table><thead><tr><th>#</th><th>الاسم</th><th>الصف</th><th>المحتسبة</th><th>كاملة</th><th>المجموع</th><th>آخر نشاط</th><th class="noprint">إجراء</th></tr></thead><tbody>' +
      list.map((s, i) => {
        const key = s.grade + '|' + s.name;
        if(EDIT && EDIT.key === key) return '<tr><td colspan="8"><div class="edit">' + (EDIT.what === 'name' ? '<input id="ed" value="' + esc(s.name) + '" aria-label="الاسم الجديد">' : '<select id="ed" aria-label="الفصل الجديد">' + [1,2,3,4].map(n => AR(s.grade) + '/' + AR(n)).map(o => '<option' + (o === s.cls ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>') + '<button class="btn sm" id="es">حفظ</button><button class="btn alt sm" id="ec">إلغاء</button></div></td></tr>';
        return '<tr><td>' + AR(i+1) + '</td><td class="n">' + esc(s.name) + '</td><td>' + GNAME[s.grade] + '</td><td>' + AR(wn(s)) + '</td><td>' + AR(wfull(s)) + '</td><td>' + AR(wsum(s)) + '</td><td>' + fmtTime(s.last) + '</td>' +
          '<td class="act noprint"><button class="btn alt sm" data-a="name" data-k="' + esc(key) + '">✏️ تعديل</button><button class="btn red sm" data-a="del" data-k="' + esc(key) + '">حذف</button></td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">لا يوجد طلاب' + (V.q || V.tg !== 'all' ? ' بهذا البحث' : ' بعد') + '.</div>') + '</div>';
  // الإعدادات
  h += '<div class="card noprint"><div class="sec-h"><h2>⚙️ الإعدادات</h2></div>' +
    '<div class="tg"><div><b>إظهار لوحة الشرف للطلاب</b><div class="muted">عند الإخفاء لا تظهر الأسماء والترتيب.</div></div><button class="sw" id="s_board" role="switch" aria-checked="' + S.board + '" aria-label="إظهار لوحة الشرف"></button></div>' +
    '<label for="s_msg" style="font-weight:700">رسالة تظهر للطلاب أعلى الصفحة (اتركها فارغة لإخفائها)</label><textarea id="s_msg" rows="2" maxlength="200" style="margin:6px 0">' + esc(S.msg) + '</textarea><button class="btn sm" id="s_save">حفظ الرسالة</button></div>';
  h += '</main></div>';
  root.innerHTML = h;
  wire();
}
function sideHTML(S){
  return '<aside class="side noprint"><h3>مبادراتي</h3>' +
    '<a class="ini" style="display:block;text-decoration:none;color:inherit" href="../nutqin-awwaliya/admin.html"><b>المواد الأربع • الصفوف الأوّلية</b><small>تحدّي نُتقن (١–٣) — لوحة مستقلة</small></a>' +
    '<button class="ini"><b>المواد الأربع • الصفوف العليا</b><small>تحدّي نُتقن — مدرسة حكيم بن حزام</small><span class="tag">' + (S.open ? 'مفتوحة' : 'موقوفة') + '</span></button>' +
    '<p>لكل صف مجموعة جديدة كل يوم دراسي (١٢ سؤالًا: ٣ لكل مادة) على تسلسل دروس المنهج في منصة عين، وتُجمع درجات أيام الأسبوع لاختيار بطل الأسبوع. تُحتسب المحاولة الأولى فقط، والإعادة للتدريب.</p></aside>';
}

function csv(rows, name){
  const s = '﻿' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], {type:'text/csv'})); a.download = name; a.click();
}
function studentRows(list){ return [['الاسم','الصف'].concat(STARTS.map((_, i) => 'الأسبوع ' + (i+1))).concat(['المجموع'])].concat(rank(list).map(s => [s.name, GNAME[s.grade]].concat(STARTS.map((_, i) => ws(s, i+1) ? ws(s, i+1)[0] : '')).concat([wsum(s)]))); }
function weekRows(list, w){ return [['الترتيب','الاسم','الصف','الدرجة','الوقت بالثواني']].concat(weekRank(list, w).map((s, i) => [i+1, s.name, GNAME[s.grade], ws(s, w)[0], ws(s, w)[1]])); }

function wire(){
  const S = D.settings;
  document.getElementById('cp').onclick = async () => { try{ await navigator.clipboard.writeText(STUDENT_URL); toast('نُسخ الرابط'); }catch(e){ toast(STUDENT_URL); } };
  async function saveSet(patch, okText){
    try{ const j = await call('settings', patch); if(!j.ok) throw 0; D.settings = j.settings; render(); toast(okText); }catch(e){ toast('تعذّر الحفظ'); }
  }
  document.getElementById('tgl').onclick = () => saveSet({open: !S.open}, S.open ? 'أُوقفت المبادرة' : 'فُتحت المبادرة للطلاب');
  document.getElementById('s_board').onclick = () => saveSet({board: !S.board}, S.board ? 'أُخفيت لوحة الشرف' : 'أصبحت لوحة الشرف ظاهرة');
  document.getElementById('s_save').onclick = () => saveSet({msg: document.getElementById('s_msg').value.trim()}, 'حُفظت الرسالة');
  root.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { V.g = b.dataset.g; render(); });
  root.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { V.w = +b.dataset.w; render(); });
  root.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => { V.tg = b.dataset.tg; EDIT = null; render(); });
  const q = document.getElementById('q');
  q.oninput = () => { V.q = q.value.trim(); const pos = q.selectionStart; render(); const q2 = document.getElementById('q'); q2.focus(); q2.setSelectionRange(pos, pos); };
  document.getElementById('pdf').onclick = () => window.print();
  document.getElementById('xw').onclick = () => csv(weekRows(D.students.filter(s => s.grade === V.g), V.w + 1), 'الأسبوع_' + (V.w + 1) + '_الصف_' + GNAME[V.g] + '.csv');
  document.getElementById('xa').onclick = () => csv(studentRows(D.students), 'نتائج_تحدي_نتقن_كل_الأسابيع.csv');
  const find = key => D.students.find(s => s.grade + '|' + s.name === key);
  root.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const s = find(b.dataset.k); if(!s) return;
    if(b.dataset.a === 'del'){
      if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent = 'تأكيد الحذف'; setTimeout(() => { if(b.isConnected){ b.classList.remove('sure'); b.textContent = 'حذف'; } }, 4000); return; }
      b.disabled = true; b.textContent = 'جارٍ الحذف…';
      try{ const j = await call('delete', {grade:s.grade, name:s.name}); if(!j.ok) throw 0; load('حُذف «' + s.name + '»'); }catch(e){ b.textContent = 'تعذّر'; }
      return;
    }
    EDIT = {key: b.dataset.k, what: b.dataset.a}; render();
    const ed = document.getElementById('ed'); ed.focus();
    document.getElementById('ec').onclick = () => { EDIT = null; render(); };
    document.getElementById('es').onclick = async () => {
      const v = ed.value.replace(/\s+/g, ' ').trim();
      if(EDIT.what === 'name' && v.length < 3) return;
      const btn = document.getElementById('es'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
      try{
        const j = EDIT.what === 'name' ? await call('rename', {grade:s.grade, name:s.name, to:v}) : await call('setcls', {grade:s.grade, name:s.name, cls:v});
        if(!j.ok) throw 0; EDIT = null; load('حُفظ التعديل');
      }catch(e){ btn.disabled = false; btn.textContent = 'تعذّر، أعد المحاولة'; }
    };
  });
}

if(PIN && linked()) load(); else login();
setInterval(() => { if(D && PIN && !EDIT && !document.hidden && document.activeElement && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) load(); }, 60000);
</script>
</body>
</html>
