<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحدّي نُتقن — الصفوف العليا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#4C1D95;--navy2:#5B21B6;--teal:#7C3AED;--gold:#F26B1D;--gold2:#FDBA74;--ice:#EDE7FB;--ink:#2E2A3D;--muted:#6B6385;--bg:#F6F3FD;--ok:#1E8E5A;--bad:#C2410C;--line:#E6DEF7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.7}
button{font:inherit;cursor:pointer;color:inherit}
.top{background:linear-gradient(135deg,#4C1D95,#7C3AED);color:#fff;padding:16px 16px 20px;text-align:center}
.top .sch{font-size:15px;font-weight:700}
.top .ini{font-size:13px;color:var(--gold2);font-weight:600}
.top h1{margin:4px 0 0;font-size:30px;line-height:1.3}
.top h1 span{color:var(--gold2)}
.top .subt{font-size:14px;color:var(--ice)}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:19px;color:var(--navy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.pill{background:var(--ice);color:var(--navy);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px;white-space:nowrap}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid #D9CCF5;border-radius:12px;background:#fff}
input:focus,select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:12px;font-weight:700;font-size:17px;background:var(--navy);color:#fff;margin-top:12px;min-height:48px;text-align:center;text-decoration:none}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.gold{background:var(--gold);color:#fff}
.err{color:var(--bad);font-size:14px;margin-top:6px;min-height:1em}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grades button{border:2px solid #D9CCF5;background:#fff;border-radius:14px;padding:12px 6px;font-weight:700;font-size:18px;color:var(--navy);min-height:56px}
.grades button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy2);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:14px}
.who b{font-size:17px}.who small{color:var(--gold2);display:block;font-size:13px}
.who button{background:transparent;border:1px solid #A78BFA;color:#fff;border-radius:10px;padding:4px 12px;font-size:13px;min-height:36px}
.wk{border:2px solid var(--teal);border-radius:20px;background:#fff;padding:18px;margin-bottom:14px}
.wk .tag{display:inline-block;background:var(--teal);color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.wk h2{margin:8px 0 2px;font-size:24px;color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.chips span{background:var(--ice);color:var(--navy);border-radius:10px;padding:2px 10px;font-size:13px;font-weight:600}
.done{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#ECF8F1;border-radius:14px;padding:10px 14px;margin-top:12px}
.done b{font-size:28px;color:var(--ok)}
.prize{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:700}
.prize small{display:block;color:var(--gold2);font-weight:600;font-size:12px}
.past{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pw{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;min-height:70px}
.pw b{display:block;color:var(--navy)}.pw small{color:var(--muted)}
.bar{display:flex;gap:4px;margin:4px 0 12px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar i.ok{background:var(--ok)}.bar i.on{background:var(--teal)}
.passage{background:#FFF7ED;border:1px solid #FED7AA;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:17px}
.passage p{margin:4px 0}
.qimg{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:12px}
.subj{display:inline-block;background:var(--ice);color:var(--navy);border-radius:999px;padding:0 10px;font-size:13px;font-weight:700;margin-bottom:6px}
.ind{background:#F5F0FF;border-right:4px solid var(--teal);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.stem{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.say{flex:none;width:40px;height:40px;border-radius:20px;border:1.5px solid var(--teal);background:#fff;display:flex;align-items:center;justify-content:center}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:#fff;border:1.5px solid #D9CCF5;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:18px;min-height:54px}
.opt span{white-space:pre-line}
.opt b{flex:none;width:32px;height:32px;border-radius:16px;border:1.5px solid var(--teal);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:15px}
.opt.bad{border-color:var(--bad);background:#FFF4EE;color:#8A2E07}
.opt.bad b{border-color:var(--bad);color:var(--bad)}
.opt.ok{border-color:var(--ok);background:#ECF8F1}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.vals{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.vals span{border:1px solid #D9CCF5;border-radius:8px;padding:0 8px}
.vals span.cur{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.big{font-size:54px;font-weight:700;color:var(--navy);text-align:center;line-height:1.2}
.big small{font-size:20px;color:var(--muted)}
.center{text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;border:1.5px solid #D9CCF5;background:#fff;border-radius:12px;padding:8px;font-size:14px;font-weight:600;color:var(--navy);min-height:44px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--teal);color:#fff;font-weight:700;padding:8px;text-align:right}
td{padding:8px;border-bottom:1px solid #EEE8FA}
tr.me td{background:#FFF4E6;font-weight:700}
td.r{width:44px;text-align:center;font-weight:700;color:var(--navy)}
.medal{display:inline-block;width:26px;height:26px;border-radius:13px;line-height:26px;text-align:center;color:#fff;font-size:13px}
.m1{background:#C9A227}.m2{background:#8C9AA0}.m3{background:#B0703A}
.empty{color:var(--muted);text-align:center;padding:14px 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.back{background:none;border:0;color:var(--teal);font-weight:700;padding:6px 0;margin-bottom:6px;min-height:40px}
.cert{border:3px double var(--gold);border-radius:18px;padding:16px;text-align:center;background:#FFFBF5}
footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 0 24px}
.chips span:nth-child(1){background:#FFEDD5;color:#C2410C}.chips span:nth-child(2){background:#EDE7FB;color:#5B21B6}.chips span:nth-child(3){background:#DCFCE7;color:#15803D}.chips span:nth-child(4){background:#DBEAFE;color:#1D4ED8}
.wk{box-shadow:0 6px 20px rgba(124,58,237,.12)}.wk .tag{background:var(--gold)}
th{background:var(--gold)}
.btn.gold{box-shadow:0 4px 14px rgba(242,107,29,.35)}
.prize{background:linear-gradient(135deg,#5B21B6,#7C3AED)}
.grades button.on,.tabs button.on{background:var(--gold);border-color:var(--gold)}
</style>
</head>

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const linked = () => API && API.indexOf('__') !== 0;

function saveRec(w, score, secs){
  w = String(w);
  const r = recs(); const x = r[w] || {};
  const first = !x.first;

}

function weekIndex(){
  const now = Date.now(); let idx = -1;
  STARTS.forEach((s, i) => { if(now >= Date.parse(s + 'T00:00:00+03:00')) idx = i; });
  return idx;
}
const FMT = new Intl.DateTimeFormat('ar-SA-u-ca-gregory', {day:'numeric', month:'long', timeZone:'Asia/Riyadh'});

let ROWS = {}, BERR = '', SET = {open:true, board:true, msg:''};
async function loadBoard(g){
  if(!linked()){ BERR = 'لوحة الشرف المشتركة لم تُربط بعد، فتظهر هنا نتائج هذا الجهاز فقط.'; ROWS[g] = ROWS[g] || []; return; }
  try{
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(API + '?action=board&stage=' + STAGE + '&grade=' + g + '&t=' + Date.now(), {signal: ctl.signal});
    clearTimeout(t);
    const j = await r.json();
    if(j.settings) SET = j.settings;
    ROWS[g] = (j.rows || []).filter(x => x.subj === 'wk' || x.subj === 'dy').map(x => ({name:String(x.name), cls:String(x.cls||''), key:(x.subj === 'dy' ? 'd' : '') + x.round, score:+x.score, secs:+x.secs}));
    BERR = '';
  }catch(e){ BERR = 'تعذّر تحميل لوحة الشرف الآن.'; ROWS[g] = ROWS[g] || []; }
}
function keyWeek(g, k){ if(k[0] !== 'd') return +k; const d = (DAYS(g) || [])[+k.slice(1) - 1]; return d ? weekOf(d.date) + 1 : 0; }
function gradeData(g){
  const base = (ROWS[g] || []).slice();
  if(PROF && PROF.grade === g){
    const r = recs();
    Object.keys(r).forEach(k => { if(r[k].first && !base.some(x => x.name === PROF.name && x.key === k)) base.push({name:PROF.name, cls:PROF.cls, key:k, score:r[k].first.score, secs:r[k].first.secs}); });
  }
  return base.map(x => ({...x, week: keyWeek(g, x.key)}));
}
function rank(list){ return list.sort((a,b) => b.score - a.score || a.secs - b.secs || a.name.localeCompare(b.name,'ar')); }
function agg(list){
  const m = {};
  list.forEach(r => { const k = r.name.trim(); if(!m[k]) m[k] = {name:k, cls:r.cls, score:0, secs:0, n:0}; m[k].score += r.score; m[k].secs += r.secs; m[k].n++; });
  return rank(Object.values(m));
}
function weekRows(g, w){ return agg(gradeData(g).filter(r => r.week === w)); }
function allRows(g){ return agg(gradeData(g)); }
function classes(g){
  const m = {};
  allRows(g).forEach(s => { const k = s.cls || '—'; if(!m[k]) m[k] = {cls:k, sum:0, n:0}; m[k].sum += s.score; m[k].n++; });
  return Object.values(m).map(c => ({...c, avg: Math.round(c.sum / c.n)})).sort((a,b) => b.avg - a.avg || b.n - a.n);
}

}

}

  if(!SET.board) body = '<div class="empty">لوحة الشرف مخفية حاليًا، وستعود قريبًا.</div>';
  else if(wi < 0) body = '<div class="empty">يبدأ التحدّي يوم ' + fmtDate(STARTS[0]) + '.</div>';
  else if(BT.tab === 'cur') body = '<div class="muted" style="margin-bottom:6px">' + (DAYS(g) ? 'الأسبوع ' + AR(wi+1) + ' • مجموع درجات مجموعات الأيام (المحاولة الأولى فقط)' : 'نموذج الأسبوع ' + AR(wi+1) + ' • تُحتسب المحاولة الأولى فقط') + '</div>' + stTable(weekRows(g, wi+1));
  else if(BT.tab === 'prev') body = '<div class="muted" style="margin-bottom:6px">' + (DAYS(g) ? 'الأسبوع ' : 'نموذج الأسبوع ') + AR(wi) + '</div>' + stTable(weekRows(g, wi));
  else if(BT.tab === 'all') body = stTable(allRows(g), true);
  else body = stTable(allRows(g), true);
  app.innerHTML = '<button class="back" id="bk">→ رجوع</button><div class="card" id="board"><h2>🏅 لوحة الشرف</h2>' +
    '<div class="grades" style="margin-bottom:10px">' + GRADES.map(x => '<button data-g="' + x[0] + '" class="' + (x[0] === g ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
    '<div class="tabs">' + tabs.map(t => '<button data-t="' + t[0] + '" class="' + (t[0] === BT.tab ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</div>' +
    body + (BERR ? '<div class="note">' + BERR + '</div>' : '<div class="note">تتحدّث تلقائيًا • عند التساوي يتقدّم الأسرع</div>') + '</div>';
  document.getElementById('bk').onclick = () => PROF ? main() : home();
  app.querySelectorAll('[data-g]').forEach(b => b.onclick = async () => { BT.g = b.dataset.g; board(); await loadBoard(BT.g); if(VIEW === 'board') board(); });
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { BT.tab = b.dataset.t; board(); });
  window.scrollTo(0, 0);
}

// ===== التسجيل =====
let VIEW = 'home';
function banner(){
  let h = '';
  if(SET.msg) h += '<div class="card" style="background:#FFF4E6;border-color:#FDBA74"><b style="color:#4C1D95">📢 ' + esc(SET.msg) + '</b></div>';
  if(!SET.open) h += '<div class="card center" style="border-color:#C2410C"><b style="color:#C2410C">التحدّي متوقف مؤقتًا</b><div class="muted">تستطيع مشاهدة لوحة الشرف، وسيُفتح التحدّي قريبًا.</div></div>';
  return h;
}
function home(){
  VIEW = 'home';
  const p = PROF || {name:'', grade:'', cls:''};
  let g = p.grade;
  app.innerHTML = banner() + '<div class="card"><h2>مرحبًا بك في تحدّي نُتقن</h2><div class="muted">كل يوم دراسي ١٢ سؤالًا جديدًا في المواد الأربع على تسلسل دروس المنهج، وتكريم أسبوعي للمركز الأول في كل صف.</div>' +
    '<label>الصف</label><div class="grades">' + GRADES.map(x => '<button data-g="' + x[0] + '" class="' + (x[0] === g ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
    '<label for="nm">اسم الطالب (الاسم الثلاثي)</label><input id="nm" autocomplete="name" value="' + esc(p.name) + '" placeholder="مثال: محمد أحمد علي">' +
    '<div class="err" id="er"></div><button class="btn" id="go">ابدأ</button></div>' +
    '<button class="btn alt" id="lb">🏅 لوحة الشرف</button>';
  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { g = b.dataset.g; app.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x === b)); });
  document.getElementById('lb').onclick = () => { BT.g = g || '1'; board(); loadBoard(BT.g).then(() => { if(VIEW === 'board') board(); }); };
  document.getElementById('go').onclick = () => {
    const name = document.getElementById('nm').value.replace(/\s+/g, ' ').trim();
    const er = document.getElementById('er');
    if(!g){ er.textContent = 'اختر صفّك.'; return; }
    if(name.split(' ').length < 2){ er.textContent = 'اكتب اسمك الثنائي أو الثلاثي.'; return; }
    PROF = {name, grade:g, cls:GNAME[g]}; LS.set('nqp_prof', PROF);
    main();
    loadBoard(g).then(() => { if(VIEW === 'main') main(); });
  };
}
function myWeekRank(w){
  const list = weekRows(PROF.grade, w);
  const i = list.findIndex(s => s.name === PROF.name);
  return i < 0 ? '' : 'ترتيبك ' + AR(i+1) + ' من ' + AR(list.length);
}

// ===== الصفحة الرئيسية للطالب =====
function main(){
  if(DAYS(PROF.grade)) return mainDays();
  VIEW = 'main';
  const wi = weekIndex(), r = recs(), W = DATA.grades[PROF.grade].weeks;
  let h = banner() + '<div class="who"><div><b>' + esc(PROF.name) + '</b><small>الصف ' + GNAME[PROF.grade] + ' الابتدائي</small></div><button id="chg">تغيير</button></div>';
  if(wi < 0){
    h += '<div class="card center"><h2>يبدأ التحدّي يوم الأحد ' + fmtDate(STARTS[0]) + '</h2></div>';
  }else{
    const x = r[wi+1], nxt = STARTS[wi+1];
    h += '<div class="prize"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg><div><small>التكريم الأسبوعي</small>جوائز وتكريم كل أسبوع للمركز الأول</div></div>';
    h += '<div class="wk"><span class="tag">نموذج الأسبوع ' + AR(wi+1) + '</span><h2>١٢ سؤالًا جديدًا</h2>' +
      '<div class="muted">من الأحد ' + fmtDate(STARTS[wi]) + (nxt ? ' حتى السبت ' + FMT.format(new Date(Date.parse(nxt + 'T12:00:00+03:00') - 864e5)) : '') + '</div>' +
      '<div class="chips"><span>لغتي ٣</span><span>الرياضيات ٣</span><span>العلوم ٣</span><span>الدراسات الإسلامية ٣</span></div>' +
      (x && x.first
        ? '<div class="done"><div><div class="muted">درجتك المحتسبة (المحاولة الأولى)</div><b>' + AR(x.first.score) + ' / ١٠٠</b><div class="muted">' + myWeekRank(wi+1) + '</div></div><button class="btn alt" id="pr" style="width:auto;margin:0;padding:8px 16px">تدرّب عليه مرة أخرى</button></div>'
        : '<button class="btn gold" id="st"' + (SET.open ? '' : ' disabled') + '>ابدأ نموذج الأسبوع</button><div class="note">تُحتسب محاولتك الأولى في لوحة الشرف، فركّز قبل أن تبدأ.</div>') +
      '</div>';
  }
  h += '<button class="btn alt" id="lb" style="margin-bottom:14px">🏅 لوحة الشرف</button>';
  if(wi > 0){
    h += '<div class="card"><h2>النماذج السابقة للتدريب</h2><div class="muted" style="margin-bottom:8px">لا تُحتسب في التكريم، لكنها تدرّبك على أسئلة نافس.</div><div class="past">' +
      W.slice(0, wi).map((_, i) => { const y = r[i+1]; return '<button class="pw" data-w="' + i + '"><b>نموذج الأسبوع ' + AR(i+1) + '</b><small>' + (y ? 'أفضل درجة ' + AR(y.best) : 'لم تحلّه بعد') + '</small></button>'; }).reverse().join('') + '</div></div>';
  }
  app.innerHTML = h;
  document.getElementById('chg').onclick = home;
  document.getElementById('lb').onclick = () => { BT.g = PROF.grade; BT.tab = 'cur'; board(); };
  const st = document.getElementById('st'); if(st) st.onclick = () => { if(SET.open) play('wk', wi, true); };
  const pr = document.getElementById('pr'); if(pr) pr.onclick = () => play('wk', wi, false);
  app.querySelectorAll('[data-w]').forEach(b => b.onclick = () => play('wk', +b.dataset.w, false));
  window.scrollTo(0, 0);
}
const PRIZE = '<div class="prize"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg><div><small>التكريم الأسبوعي</small>جوائز وتكريم كل أسبوع للمركز الأول</div></div>';
// الصف الذي له مجموعة جديدة كل يوم
function mainDays(){
  VIEW = 'main';
  const D = DAYS(PROF.grade), di = dayIndex(PROF.grade), r = recs(), wi = weekIndex();
  let h = banner() + '<div class="who"><div><b>' + esc(PROF.name) + '</b><small>الصف ' + GNAME[PROF.grade] + ' الابتدائي</small></div><button id="chg">تغيير</button></div>';
  if(di < 0){
    h += '<div class="card center"><h2>تبدأ المجموعات يوم ' + fmtDay(D[0].date) + '</h2></div>';
  }else{
    const x = r['d' + (di+1)], d = D[di];
    const mine = wi >= 0 ? weekRows(PROF.grade, wi+1).find(s => s.name === PROF.name) : null;
    h += PRIZE + '<div class="wk"><span class="tag">مجموعة اليوم</span><h2>' + fmtDay(d.date) + '</h2>' +
      '<div class="muted">١٢ سؤالًا جديدًا • تُجمع درجات أيام الأسبوع لاختيار بطل الأسبوع</div>' +
      '<div class="chips"><span>لغتي ٣</span><span>الرياضيات ٣</span><span>العلوم ٣</span><span>الدراسات الإسلامية ٣</span></div>' +
      (x && x.first
        ? '<div class="done"><div><div class="muted">درجتك اليوم (المحاولة الأولى)</div><b>' + AR(x.first.score) + ' / ١٠٠</b>' + (mine ? '<div class="muted">مجموعك هذا الأسبوع ' + AR(mine.score) + ' • ' + myWeekRank(wi+1) + '</div>' : '') + '<div class="muted">ترقّب مجموعة جديدة غدًا</div></div><button class="btn alt" id="pr" style="width:auto;margin:0;padding:8px 16px">تدرّب عليها مرة أخرى</button></div>'
        : '<button class="btn gold" id="st"' + (SET.open ? '' : ' disabled') + '>ابدأ مجموعة اليوم</button><div class="note">تُحتسب محاولتك الأولى في لوحة الشرف، فركّز قبل أن تبدأ.</div>') +
      '</div>';
  }
  h += '<button class="btn alt" id="lb" style="margin-bottom:14px">🏅 لوحة الشرف</button>';
  if(di > 0){
    h += '<div class="card"><h2>مجموعات الأيام السابقة</h2><div class="muted" style="margin-bottom:8px">إن لم تحلّها في يومها فمحاولتك الأولى تُحتسب لأسبوعها، والإعادة للتدريب.</div><div class="past">' +
      D.slice(0, di).map((d, i) => { const y = r['d' + (i+1)]; return '<button class="pw" data-d="' + i + '"><b>' + fmtDay(d.date) + '</b><small>' + (y ? 'درجتك ' + AR(y.first.score) : 'لم تحلّها بعد') + '</small></button>'; }).reverse().join('') + '</div></div>';
  }
  app.innerHTML = h;
  document.getElementById('chg').onclick = home;
  document.getElementById('lb').onclick = () => { BT.g = PROF.grade; BT.tab = 'cur'; board(); };
  const st = document.getElementById('st'); if(st) st.onclick = () => { if(SET.open) play('dy', di, true); };
  const pr = document.getElementById('pr'); if(pr) pr.onclick = () => play('dy', di, false);
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const i = +b.dataset.d; play('dy', i, !r['d' + (i+1)] && SET.open); });
  window.scrollTo(0, 0);
}

// ===== الأسئلة =====
let audio;
function beep(f, d){ try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; g.gain.value = .06; o.connect(g); g.connect(audio.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d); o.stop(audio.currentTime + d); }catch(e){} }
const canSay = 'speechSynthesis' in window;
function say(t){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ar-SA'; u.rate = .85; const v = speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang)); if(v) u.voice = v; speechSynthesis.speak(u); }catch(e){} }
function shuffleOpts(q){
  const idx = q.opts.map((_, i) => i);
  for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return {...q, opts: idx.map(i => q.opts[i]), ans: idx.indexOf(q.ans)};
}
function play(kind, wi, counted){
  VIEW = 'play';
  const isDay = kind === 'dy', D = DAYS(PROF.grade);
  const title = isDay ? 'مجموعة ' + fmtDay(D[wi].date) : 'نموذج الأسبوع ' + AR(wi+1);
  const recId = isDay ? 'd' + (wi+1) : wi+1;
  const Q = (isDay ? D[wi].q : DATA.grades[PROF.grade].weeks[wi]).map(shuffleOpts);
  const S = {i:0, tries:0, raw:0, t0:Date.now(), wrong:[]};
  function render(){
    const it = Q[S.i];
    app.innerHTML = '<div class="card">' +
      '<div class="row"><span class="muted">' + title + (counted ? '' : ' • تدريب') + ' • السؤال ' + AR(S.i+1) + ' من ' + AR(Q.length) + '</span><span class="pill">⭐ ' + AR(Math.round(S.raw / (Q.length * 20) * 100)) + '</span></div>' +
      '<div class="bar">' + Q.map((_, j) => '<i class="' + (j < S.i ? 'ok' : j === S.i ? 'on' : '') + '"></i>').join('') + '</div>' +
      '<span class="subj">' + SNAME[it.s] + '</span>' +
      (function(){ if(it.t) return '<div class="ind">📌 ' + esc(it.t) + '</div>'; const x = (DATA.grades[PROF.grade].secs[it.s] || [])[it.sec]; return x ? '<div class="ind">📌 ' + esc(x[0]) + (x[1] ? ' — ' + esc(x[1]) : '') + '</div>' : ''; })() +
      (it.ctx && it.ctx.length ? '<div class="passage">' + it.ctx.map(p => '<p>' + esc(p) + '</p>').join('') + '</div>' : '') +
      (it.img ? '<img class="qimg" src="' + it.img + '" alt="صورة السؤال">' : '') +
      '<div class="stem">' + (canSay ? '<button class="say" id="sy" aria-label="اقرأ السؤال"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>' : '') + '<span style="white-space:pre-line">' + esc(it.stem) + '</span></div>' +
      it.opts.map((o, j) => '<button class="opt' + (S.wrong.includes(j) ? ' bad' : '') + '" data-j="' + j + '"' + (S.wrong.includes(j) ? ' disabled' : '') + '><b>' + LETTERS[j] + '</b><span>' + esc(o) + '</span></button>').join('') +
      '<div class="vals">قيمة السؤال الآن: ' + VALS.map((v, k) => '<span class="' + (k === Math.min(S.tries, 4) ? 'cur' : '') + '">' + AR(v) + '</span>').join('') + '</div></div>';
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.j, b));
    const sy = document.getElementById('sy');
    if(sy) sy.onclick = () => say((it.ctx || []).join(' ') + ' ' + it.stem + ' ' + it.opts.map((o, j) => LETTERS[j] + ' ' + o).join('، '));
    window.scrollTo(0, 0);
  }
  function pick(j, b){
    const it = Q[S.i];
    if(j === it.ans){
      S.raw += VALS[Math.min(S.tries, 4)];
      b.classList.add('ok'); beep(660, .25); setTimeout(() => beep(880, .3), 120);
      app.querySelectorAll('.opt').forEach(x => x.disabled = true);
      setTimeout(() => { S.i++; S.tries = 0; S.wrong = []; if(S.i < Q.length) render(); else finish(); }, 850);
    }else{ S.tries++; S.wrong.push(j); beep(220, .3); render(); }
  }
  async function finish(){
    VIEW = 'result';
    try{ speechSynthesis.cancel(); }catch(e){}
    const secs = Math.round((Date.now() - S.t0) / 1000);
    const score = Math.round(S.raw / (Q.length * 20) * 100);
    const first = saveRec(recId, score, secs) && counted;
    app.innerHTML = '<div class="card center"><div class="cert"><div style="font-size:20px;font-weight:700;color:#4C1D95">' + (score >= 90 ? 'ممتاز! أداء بطل' : score >= 70 ? 'أحسنت!' : 'محاولة جيدة') + '</div>' +
      '<div style="font-size:22px;font-weight:700;color:#7C3AED">' + esc(PROF.name) + '</div>' +
      '<div class="muted">' + title + ' • الصف ' + GNAME[PROF.grade] + '</div>' +
      '<div class="big">' + AR(score) + '<small> / ١٠٠</small></div><div class="muted">الوقت: ' + AR(Math.floor(secs/60)) + ' د ' + AR(secs%60) + ' ث</div></div>' +
      '<div class="note" id="sv">' + (first ? 'جارٍ حفظ درجتك في لوحة الشرف…' : 'محاولة تدريبية، لا تُحتسب في التكريم.') + '</div>' +
      '<div class="two"><button class="btn alt" id="again">تدرّب مرة أخرى</button><button class="btn" id="hm">الصفحة الرئيسية</button></div>' +
      '<button class="btn alt" id="lb">🏅 لوحة الشرف</button></div>';
    document.getElementById('again').onclick = () => play(kind, wi, false);
    document.getElementById('hm').onclick = main;
    document.getElementById('lb').onclick = () => { BT.g = PROF.grade; BT.tab = (isDay ? weekOf(D[wi].date) : wi) === weekIndex() ? 'cur' : 'prev'; board(); };
    if(!first) return;
    const sv = document.getElementById('sv');
    if(!linked()){ sv.textContent = 'حُفظت درجتك على هذا الجهاز.'; return; }
    try{
      const q = new URLSearchParams({action:'submit', stage:STAGE, grade:PROF.grade, subj:kind, round:wi+1, name:PROF.name, cls:PROF.cls, score, secs, dev:devId()});
      const j = await (await fetch(API + '?' + q.toString())).json();
      sv.textContent = j.ok ? 'حُفظت درجتك في لوحة الشرف ✓' : (j.error === 'closed' ? 'التحدّي متوقف الآن، فلم تُحفظ الدرجة.' : 'تعذّر الحفظ، أخبر معلمك.');
      await loadBoard(PROF.grade);
    }catch(e){ sv.textContent = 'تعذّر الاتصال بلوحة الشرف الآن، ودرجتك محفوظة على هذا الجهاز.'; }
  }
  render();
}

// ===== البداية =====
if(location.hash === '#board'){ BT.g = PROF ? PROF.grade : '1'; board(); } else if(PROF && DATA.grades[PROF.grade]) main(); else home();
function refresh(){
  const g = VIEW === 'board' ? BT.g : (PROF ? PROF.grade : '1');
  loadBoard(g).then(() => { if(VIEW === 'board') board(); else if(VIEW === 'main') main(); else if(VIEW === 'home' && (SET.msg || !SET.open) && !(document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName))) home(); });
}
refresh();
setInterval(() => { if(!document.hidden && linked()) refresh(); }, 30000);
</script>
