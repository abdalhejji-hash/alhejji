<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحدّي نُتقن الأسبوعي — لغتي الثالث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#13435A;--navy2:#17495A;--teal:#148E9D;--teal2:#168C9A;--gold:#A99C6E;--gold2:#BBAF87;--ice:#DDF1F3;--ink:#2B3A40;--muted:#5F7078;--bg:#F3F7F7;--ok:#1E8E5A;--bad:#C2410C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.7}
button{font:inherit;cursor:pointer}
.top{background:var(--navy);color:#fff;padding:18px 16px 22px;text-align:center}
.top .sch{font-size:15px;font-weight:700}
.top .ini{font-size:13px;color:var(--gold2);font-weight:600}
.top h1{margin:6px 0 0;font-size:30px;line-height:1.3}
.top h1 span{color:var(--gold2)}
.top .sub{font-size:14px;color:var(--ice)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #DCE6E8;border-radius:18px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:19px;color:var(--navy)}
.ind{background:var(--navy2);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.ind .k{font-size:12px;color:var(--gold2);font-weight:700}
.ind .v{font-size:16px;font-weight:600}
.wk{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.pill{background:var(--ice);color:var(--navy);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid #C9D7DA;border-radius:12px;background:#fff}
input:focus,select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:17px;background:var(--navy);color:#fff;margin-top:14px;min-height:48px}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:14px;margin-top:6px;min-height:1em}
.bar{display:flex;gap:6px;margin:4px 0 12px}
.bar i{flex:1;height:6px;border-radius:3px;background:#DCE6E8}
.bar i.ok{background:var(--ok)}.bar i.on{background:var(--teal)}
.passage{background:#FBF9F2;border:1px solid #E8E1C9;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:16px}
.passage p{margin:4px 0}
.qimg{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:12px}
.stem{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:#fff;border:1.5px solid #C9D7DA;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:17px;min-height:52px}
.opt b{flex:none;width:32px;height:32px;border-radius:16px;border:1.5px solid var(--teal);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:15px}
.opt.bad{border-color:var(--bad);background:#FFF4EE;color:#8A2E07}
.opt.bad b{border-color:var(--bad);color:var(--bad)}
.opt.ok{border-color:var(--ok);background:#ECF8F1}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt:disabled{cursor:default}
.vals{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin-top:4px}
.vals span{border:1px solid #C9D7DA;border-radius:8px;padding:0 8px}
.vals span.cur{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.big{font-size:56px;font-weight:700;color:var(--navy);text-align:center;line-height:1.2}
.big small{font-size:20px;color:var(--muted)}
.center{text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;border:1.5px solid #C9D7DA;background:#fff;border-radius:12px;padding:8px;font-size:14px;font-weight:600;color:var(--navy);min-height:44px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--teal);color:#fff;font-weight:700;padding:8px;text-align:right}
td{padding:8px;border-bottom:1px solid #E3ECEE}
tr.me td{background:#FFF8E1;font-weight:700}
td.r{width:44px;text-align:center;font-weight:700;color:var(--navy)}
.medal{display:inline-block;width:26px;height:26px;border-radius:13px;line-height:26px;text-align:center;color:#fff;font-size:13px}
.m1{background:#C9A227}.m2{background:#8C9AA0}.m3{background:#B0703A}
.empty{color:var(--muted);text-align:center;padding:14px 0}
.cert{border:3px double var(--gold);border-radius:18px;padding:18px;text-align:center;background:#FFFDF6}
.cert .t{font-size:22px;font-weight:700;color:var(--navy)}
.cert .n{font-size:26px;font-weight:700;color:var(--teal);margin:6px 0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 0 24px}
</style>
</head>

<script>

const API = "__API__";
// =================================================
const DATA = {"secs":["دلالات الألفاظ","فهم المقروء","أفكّر وأبدي رأيي"],"weeks":[{"start":"2026-11-01","sec":0,"q":[{"stem":"وضعْتُ التفّاحَ في ..........","opts":["السيّارة","السلّة","السماء","الثلّاجة"],"ans":2,"ctx":["ما الكلمةُ التي لا تُناسِبُ الجملةَ الآتيةَ؟"],"img":""},{"stem":"ما المفردُ الصحيحُ لكلمةِ «أقلام»؟","opts":["قلَمان","قلَمَيْن","قلَمات","قلَم"],"ans":3,"ctx":["اشترى المعلّمُ مجموعةً جديدةً من الأقلامِ لتوزيعِها على الطلّابِ في بدايةِ الفصلِ الدراسيّ."],"img":""},{"stem":"أسّسَ الإمامُ محمّدُ بنُ سعودٍ الدولةَ الأولى لـ:","opts":["يجمعَ الناسَ على الدينِ والوحدةِ والأمنِ","يجعلَ له قصرًا كبيرًا","يقيمَ السباقاتِ الرياضيّةَ","يسافرَ إلى الدولِ الأخرى"],"ans":0,"ctx":["في يومِ التأسيسِ نفتخرُ بوطنِنا الغالي المملكةِ العربيّةِ السعوديّةِ، ونتذكّرُ كيفَ بدأَ الإمامُ محمّدُ بنُ سعودٍ – رحمَه اللهُ – بناءَ الدولةِ الأولى. كانَ حلمُه أن يكونَ للناسِ وطنٌ يجمعُهم على الدينِ والوحدةِ والأمنِ، فتعاونَ معَ العلماءِ والأهالي، فأقاموا الدولةَ على العدلِ والإيمانِ.","ونحنُ اليومَ نسيرُ على خُطاه في عهدِ ملكِنا ووليِّ عهدِنا – حفظَهما اللهُ –. في يومِ التأسيسِ نلبسُ اللباسَ التراثيَّ، ونرفعُ العلمَ فخرًا واعتزازًا، ونشاهدُ الفعاليّاتِ، ونسمعُ الأناشيدَ الوطنيّةَ فنشعرُ بالسرورِ.","ويعلّمُنا يومُ التأسيسِ أن نحبَّ وطنَنا ونحفظَه من كلِّ سوءٍ؛ فالوطنُ نعمةٌ كبيرةٌ يجبُ أن نشكرَ اللهَ عليها."],"img":""},{"stem":"ما الرأيُ الذي نستطيعُ تكوينَه حولَ المعلوماتِ في النصِّ؟","opts":["غامضةٌ ومربكةٌ","قليلةٌ وغيرُ مفيدةٍ","غيرُ مرتبطةٍ بالموضوعِ","كاملةٌ وواضحةٌ تبيّنُ فخرَ الوطنِ"],"ans":3,"ctx":["منتخبُنا السعوديُّ فخرُ الوطنِ. يحبُّ أبناءُ المملكةِ العربيّةِ السعوديّةِ لعبةَ كرةِ القدمِ؛ فهي لعبةٌ جميلةٌ تعلّمُنا التعاونَ والإخلاصَ والاجتهادَ. ومنتخبُنا السعوديُّ يمثّلُ وطنَنا في الملاعبِ الدوليّةِ.","يلعبُ اللاعبونَ بحبٍّ وحماسٍ لرفعِ العلمِ السعوديِّ عاليًا، ونفرحُ جميعًا عندما يحقّقُ المنتخبُ الفوزَ في المبارياتِ، ونشجّعُه بالهتافِ ورفعِ العلمِ فخرًا واعتزازًا.","ويعلّمُنا اللاعبونَ أن نجتهدَ ونعملَ كفريقٍ واحدٍ، كما يعلّمونَنا الأدبَ الرياضيَّ واحترامَ الفريقِ الآخرِ. فالفوزُ الحقيقيُّ هو أن نكونَ مثالًا في الأخلاقِ والعطاءِ."],"img":""},{"stem":"نوعُ كلمةِ (الجنود) في النصِّ:","opts":["مؤنّث – اسم – مفرد","مذكّر – اسم – جمع","مذكّر – فعل – جمع","مذكّر – اسم – مثنّى"],"ans":1,"ctx":["المملكةُ العربيّةُ السعوديّةُ وطنُنا الغالي، ننعمُ فيه بالأمنِ والأمانِ، ويعيشُ فيه الناسُ متعاونينَ متحابّينَ. وقد بذلَ الملكُ المؤسّسُ عبدُالعزيزِ – رحمَه اللهُ – جهودًا كبيرةً في توحيدِ البلادِ وجمعِ كلمةِ أهلِها، حتّى أصبحتْ دولةً قويّةً موحّدةً.","ويرتفعُ فوقَ رؤوسِنا العلمُ الأخضرُ يحملُ كلمةَ التوحيدِ، فنشعرُ بفخرٍ وعزّةٍ، ويحرسُ جنودُنا البواسلُ حدودَ الوطنِ ليلًا ونهارًا، حتّى ينامَ المواطنونَ في أمانٍ.","ويحبُّ الطلابُ وطنَهم كثيرًا؛ فيجتهدونَ في دروسِهم، ويحافظونَ على نظافةِ مدرستِهم، ويساعدونَ زملاءَهم، ويحلمونَ أن يصبحوا أطبّاءَ ومعلّمينَ ومهندسينَ يخدمونَ وطنَهم. فحبُّ السعوديّةِ ليسَ كلامًا، بل عملٌ وإخلاصٌ."],"img":""}]},{"start":"2026-11-08","sec":1,"q":[{"stem":"يمكنُ للتعاونِ أن يقوّيَ المجتمعَ بـ:","opts":["جعلِ الناسِ يعملونَ وحدَهم","جمعِ الجهودِ وتحقيقِ النجاحِ","زيادةِ العداوةِ بينَ الأفرادِ","تركِ المساعدةِ والاهتمامِ"],"ans":1,"ctx":["يعيشُ الناسُ في المجتمعِ معًا، ويحتاجونَ إلى بعضِهم في حياتِهم اليوميّةِ، والتعاونُ يساعدُ الجميعَ على إنجازِ الأعمالِ بسهولةٍ وسرعةٍ.","عندما يتعاونُ الأطفالُ في المدرسةِ يصبحُ الدرسُ ممتعًا ويزدادُ الفهمُ، وكذلك التعاونُ بينَ الجيرانِ يجعلُ الحيَّ نظيفًا وآمنًا.","ويستطيعُ الأطفالُ مشاركةَ الألعابِ والكتبِ معَ أصدقائِهم ليتعلّموا المشاركةَ والعطاءَ. فالتعاونُ قيمةٌ مهمّةٌ تجعلُ المجتمعَ أقوى وأكثرَ ترابطًا."],"img":""},{"stem":"ما الفكرةُ الرئيسةُ للفقرةِ الأولى من النصِّ؟","opts":["قراءةُ الطلابِ في المكتبةِ","تنظيمُ معرضِ الكتابِ السنويِّ في المدرسةِ","أنواعُ الكتبِ المفضّلةِ","أهميّةُ النشاطِ الرياضيِّ"],"ans":1,"ctx":["تستضيفُ المدرسةُ كلَّ عامٍ معرضًا للكتابِ، تُعرَضُ فيه أنواعٌ متعدّدةٌ من الكتبِ التي تناسبُ جميعَ الأعمارِ. ويشجّعُ المعرضُ الطلابَ على القراءةِ، ويمنحُهم فرصةَ اقتناءِ كتبٍ جديدةٍ.","ويُعَدُّ هذا المعرضُ فرصةً رائعةً لنشرِ الثقافةِ وتحفيزِ الطلابِ على الاهتمامِ بالقراءةِ والتعلّمِ."],"img":""},{"stem":"ما الجملةُ التي تستخدمُ كلمةَ «تسلَّلَتْ» بشكلٍ صحيحٍ؟","opts":["تسلَّلَتِ السيّارةُ في القراءةِ.","تسلَّلَتِ القطّةُ إلى المطبخِ بهدوءٍ.","تسلَّلَتِ الحقيبةُ في الحقلِ.","تسلَّلَ البابُ عن الطريقِ."],"ans":1,"ctx":[],"img":""},{"stem":"ما رأيُك في موضوعِ النصِّ؟","opts":["غامضٌ ويجعلُ الطالبَ يتشوّشُ","لا يقدّمُ معلوماتٍ","واضحٌ ويقرّبُ المعنى بسهولةٍ","غيرُ مرتبطٍ بالعنوانِ"],"ans":2,"ctx":["منتخبُنا السعوديُّ فخرُ الوطنِ. يحبُّ أبناءُ المملكةِ العربيّةِ السعوديّةِ لعبةَ كرةِ القدمِ؛ فهي لعبةٌ جميلةٌ تعلّمُنا التعاونَ والإخلاصَ والاجتهادَ. ومنتخبُنا السعوديُّ يمثّلُ وطنَنا في الملاعبِ الدوليّةِ.","يلعبُ اللاعبونَ بحبٍّ وحماسٍ لرفعِ العلمِ السعوديِّ عاليًا، ونفرحُ جميعًا عندما يحقّقُ المنتخبُ الفوزَ في المبارياتِ، ونشجّعُه بالهتافِ ورفعِ العلمِ فخرًا واعتزازًا.","ويعلّمُنا اللاعبونَ أن نجتهدَ ونعملَ كفريقٍ واحدٍ، كما يعلّمونَنا الأدبَ الرياضيَّ واحترامَ الفريقِ الآخرِ. فالفوزُ الحقيقيُّ هو أن نكونَ مثالًا في الأخلاقِ والعطاءِ."],"img":""},{"stem":"لماذا سعتِ المملكةُ إلى استثمارِ الشمسِ والرياحِ لتوليدِ الكهرباءِ؟","opts":["لبناءِ مصانعِ سيّاراتٍ جديدةٍ","لإنتاجِ الطاقةِ المؤقّتةِ","لزيادةِ استهلاكِ النفطِ","لتقليلِ الاعتمادِ على النفطِ وتحقيقِ الاستقرارِ الاقتصاديِّ"],"ans":3,"ctx":["وقفَ سالمٌ بجانبِ والدِه يتأمّلُ صفوفَ الألواحِ الشمسيّةِ الممتدّةِ في الأفقِ، وقد كانتْ تلمعُ تحتَ أشعّةِ الشمسِ كمرآةٍ ضخمةٍ.","قالَ سالمٌ بإعجابٍ: ما أجملَ هذا المنظرَ يا أبي! هل تولّدُ هذه الألواحُ الكهرباءَ حقًّا؟ ابتسمَ الأبُ وقالَ: نعم يا بنيّ، هذا أحدُ مشاريعِ الطاقةِ المتجدّدةِ، وهو من مبادراتِ رؤيةِ السعوديّةِ 2030 التي تهدفُ إلى تنويعِ مصادرِ الطاقةِ في بلادِنا.","سارَ الاثنانِ بينَ الممرّاتِ، فشرحَ الأبُ لابنِه كيفَ تسعى المملكةُ إلى استثمارِ الشمسِ والرياحِ لتوليدِ الكهرباءِ النظيفةِ، حتّى يقلَّ الاعتمادُ على النفطِ، وتُحفَظَ البيئةُ، وينعمَ الناسُ باقتصادٍ مستقرٍّ وبيئةٍ صحيّةٍ.","قالَ سالمٌ بحماسٍ: إذن سننتجُ الطاقةَ من الطبيعةِ دونَ أن نؤذيَها! فأجابَه الأبُ بفخرٍ: هذا ما نسعى إليه.","وفي نهايةِ الجولةِ قالَ سالمٌ: سأكبرُ يا أبي لأعملَ في هذا المشروعِ العظيمِ، وأكونَ جزءًا من السعوديّةِ الخضراءِ التي تضيءُ العالمَ بطاقةٍ متجدّدةٍ لا تنفدُ."],"img":""}]},{"start":"2026-11-15","sec":2,"q":[{"stem":"ما العبرةُ التي يتعلّمُها الطالبُ من النصِّ؟","opts":["تركُ دراستِه","الاستغناءُ عن الوطنِ","السفرُ دائمًا","أن يحميَ الوطنَ ويقدّرَ نعمةَ الأمنِ"],"ans":3,"ctx":["في يومِ التأسيسِ نفتخرُ بوطنِنا الغالي المملكةِ العربيّةِ السعوديّةِ، ونتذكّرُ كيفَ بدأَ الإمامُ محمّدُ بنُ سعودٍ – رحمَه اللهُ – بناءَ الدولةِ الأولى. كانَ حلمُه أن يكونَ للناسِ وطنٌ يجمعُهم على الدينِ والوحدةِ والأمنِ، فتعاونَ معَ العلماءِ والأهالي، فأقاموا الدولةَ على العدلِ والإيمانِ.","ونحنُ اليومَ نسيرُ على خُطاه في عهدِ ملكِنا ووليِّ عهدِنا – حفظَهما اللهُ –. في يومِ التأسيسِ نلبسُ اللباسَ التراثيَّ، ونرفعُ العلمَ فخرًا واعتزازًا، ونشاهدُ الفعاليّاتِ، ونسمعُ الأناشيدَ الوطنيّةَ فنشعرُ بالسرورِ.","ويعلّمُنا يومُ التأسيسِ أن نحبَّ وطنَنا ونحفظَه من كلِّ سوءٍ؛ فالوطنُ نعمةٌ كبيرةٌ يجبُ أن نشكرَ اللهَ عليها."],"img":""},{"stem":"أيُّ العباراتِ الآتيةِ تعبّرُ عن شعورِ الكاتبِ تجاهَ وطنِه؟","opts":["«يحرسُ جنودُنا حدودَ الوطنِ»","«فنشعرُ بفخرٍ وعزّةٍ»","«يحافظونَ على نظافةِ مدرستِهم»","«يحلمونَ أن يصبحوا أطبّاءَ»"],"ans":1,"ctx":["المملكةُ العربيّةُ السعوديّةُ وطنُنا الغالي، ننعمُ فيه بالأمنِ والأمانِ، ويعيشُ فيه الناسُ متعاونينَ متحابّينَ. وقد بذلَ الملكُ المؤسّسُ عبدُالعزيزِ – رحمَه اللهُ – جهودًا كبيرةً في توحيدِ البلادِ وجمعِ كلمةِ أهلِها، حتّى أصبحتْ دولةً قويّةً موحّدةً.","ويرتفعُ فوقَ رؤوسِنا العلمُ الأخضرُ يحملُ كلمةَ التوحيدِ، فنشعرُ بفخرٍ وعزّةٍ، ويحرسُ جنودُنا البواسلُ حدودَ الوطنِ ليلًا ونهارًا، حتّى ينامَ المواطنونَ في أمانٍ.","ويحبُّ الطلابُ وطنَهم كثيرًا؛ فيجتهدونَ في دروسِهم، ويحافظونَ على نظافةِ مدرستِهم، ويساعدونَ زملاءَهم، ويحلمونَ أن يصبحوا أطبّاءَ ومعلّمينَ ومهندسينَ يخدمونَ وطنَهم. فحبُّ السعوديّةِ ليسَ كلامًا، بل عملٌ وإخلاصٌ."],"img":""},{"stem":"ما نوعُ كلمةِ (الكُتُب) في الجملةِ السابقةِ؟","opts":["مذكَّر – فعل – جمع","مؤنَّث – اسم – مفرد","مذكَّر – اسم – جمع","مذكَّر – اسم – مثنًّى"],"ans":2,"ctx":["«حيثُ يجدُ الكثيرَ من الكتبِ المفيدةِ»."],"img":""},{"stem":"الجملةُ التي استُخدِمتْ فيها كلمةُ (الأمان) استخدامًا صحيحًا:","opts":["يشعرُ الطفلُ بالأمانِ في حضنِ أمِّه.","أكلتُ الأمانَ في الصباحِ.","لعبَ الأمانُ في الحديقةِ.","كتبَ الأمانُ الدرسَ."],"ans":0,"ctx":["المملكةُ العربيّةُ السعوديّةُ وطنُنا الغالي، ننعمُ فيه بالأمنِ والأمانِ، ويعيشُ فيه الناسُ متعاونينَ متحابّينَ. وقد بذلَ الملكُ المؤسّسُ عبدُالعزيزِ – رحمَه اللهُ – جهودًا كبيرةً في توحيدِ البلادِ وجمعِ كلمةِ أهلِها، حتّى أصبحتْ دولةً قويّةً موحّدةً.","ويرتفعُ فوقَ رؤوسِنا العلمُ الأخضرُ يحملُ كلمةَ التوحيدِ، فنشعرُ بفخرٍ وعزّةٍ، ويحرسُ جنودُنا البواسلُ حدودَ الوطنِ ليلًا ونهارًا، حتّى ينامَ المواطنونَ في أمانٍ.","ويحبُّ الطلابُ وطنَهم كثيرًا؛ فيجتهدونَ في دروسِهم، ويحافظونَ على نظافةِ مدرستِهم، ويساعدونَ زملاءَهم، ويحلمونَ أن يصبحوا أطبّاءَ ومعلّمينَ ومهندسينَ يخدمونَ وطنَهم. فحبُّ السعوديّةِ ليسَ كلامًا، بل عملٌ وإخلاصٌ."],"img":""},{"stem":"ما رأيُك في النصِّ؟","opts":["مملٌّ وغيرُ ممتعٍ","يدعو إلى شكرِ اللهِ على نعمةِ الوطنِ","لا يهتمُّ بالوطنِ","يفضّلُ السفرَ واللعبَ"],"ans":1,"ctx":["في يومِ التأسيسِ نفتخرُ بوطنِنا الغالي المملكةِ العربيّةِ السعوديّةِ، ونتذكّرُ كيفَ بدأَ الإمامُ محمّدُ بنُ سعودٍ – رحمَه اللهُ – بناءَ الدولةِ الأولى. كانَ حلمُه أن يكونَ للناسِ وطنٌ يجمعُهم على الدينِ والوحدةِ والأمنِ، فتعاونَ معَ العلماءِ والأهالي، فأقاموا الدولةَ على العدلِ والإيمانِ.","ونحنُ اليومَ نسيرُ على خُطاه في عهدِ ملكِنا ووليِّ عهدِنا – حفظَهما اللهُ –. في يومِ التأسيسِ نلبسُ اللباسَ التراثيَّ، ونرفعُ العلمَ فخرًا واعتزازًا، ونشاهدُ الفعاليّاتِ، ونسمعُ الأناشيدَ الوطنيّةَ فنشعرُ بالسرورِ.","ويعلّمُنا يومُ التأسيسِ أن نحبَّ وطنَنا ونحفظَه من كلِّ سوءٍ؛ فالوطنُ نعمةٌ كبيرةٌ يجبُ أن نشكرَ اللهَ عليها."],"img":""}]},{"start":"2026-11-29","sec":1,"q":[{"stem":"ما المعنى الذي يمكنُ استخلاصُه من الحديثِ الشريفِ؟","opts":["الإنسانُ يختارُ وظيفتَه بنفسِه فقط.","العملُ ليسَ ضروريًّا إذا لم يُطلَبْ منك.","جميعُ الناسِ متشابهونَ في قدراتِهم وأعمالِهم.","كلُّ إنسانٍ مُيسَّرٌ لما يناسبُ فطرتَه ومهاراتِه."],"ans":3,"ctx":["قالَ رسولُ اللهِ ﷺ: «اعملوا فكلٌّ مُيسَّرٌ لما خُلِقَ له»."],"img":""},{"stem":"هل يكفي أن نحبَّ الوطنَ بالكلامِ؟","opts":["لا، بل بالعملِ والإخلاصِ كما في النصِّ","نعم، الكلامُ يكفي","نغنّي فقط","نرفعُ الشعارَ بلا عملٍ"],"ans":0,"ctx":["يحبُّ الأولادُ وطنَهم السعوديّةَ؛ فهي أرضُ الأمنِ والعزِّ. ويتذكّرُ الناسُ يومَ التأسيسِ الذي بدأَ فيه المجدُ والعمارُ، حينَ أسّسَ الإمامُ محمّدُ بنُ سعودٍ – رحمَه اللهُ – الدولةَ الأولى في الدرعيّةِ. كانَ الناسُ يتعاونونَ ويعملونَ بجدٍّ لبناءِ وطنٍ قويٍّ.","وفي يومِ التأسيسِ يفرحُ الأطفالُ، فيرتدونَ اللباسَ التراثيَّ، ويرفعونَ العلمَ بفخرٍ، وتتزيّنُ المدارسُ بالألوانِ والأناشيدِ الوطنيّةِ.","يقولُ المعلّمُ: «مَن يحبُّ وطنَه يعملُ ويخلصُ له»، ويتعلّمُ الأولادُ أنّ الوطنَ بيتٌ كبيرٌ نحفظُه بالعملِ والمحبّةِ، ويدعونَ اللهَ أن يحميَ الوطنَ ويديمَ فيه الأمنَ والرخاءَ."],"img":""},{"stem":"ما معنى كلمةِ «تحدِّيات» في الجملةِ السابقةِ؟","opts":["إنجازات","مطالِب","تحسينات","صعوبات"],"ans":3,"ctx":["واجهَ الفريقُ تحدِّياتٍ صعبةً خلالَ الرحلةِ، لكنَّه تغلَّبَ عليها بالتعاونِ والعزيمةِ."],"img":""},{"stem":"لو رأيتَ زميلًا لا يريدُ المشاركةَ في يومِ التأسيسِ، ماذا تفعلُ؟","opts":["أتركُه وحدَه","أسخرُ منه","أغضبُ عليه","أشجّعُه بحبٍّ ليحبَّ الوطنَ"],"ans":3,"ctx":["يحبُّ الأولادُ وطنَهم السعوديّةَ؛ فهي أرضُ الأمنِ والعزِّ. ويتذكّرُ الناسُ يومَ التأسيسِ الذي بدأَ فيه المجدُ والعمارُ، حينَ أسّسَ الإمامُ محمّدُ بنُ سعودٍ – رحمَه اللهُ – الدولةَ الأولى في الدرعيّةِ. كانَ الناسُ يتعاونونَ ويعملونَ بجدٍّ لبناءِ وطنٍ قويٍّ.","وفي يومِ التأسيسِ يفرحُ الأطفالُ، فيرتدونَ اللباسَ التراثيَّ، ويرفعونَ العلمَ بفخرٍ، وتتزيّنُ المدارسُ بالألوانِ والأناشيدِ الوطنيّةِ.","يقولُ المعلّمُ: «مَن يحبُّ وطنَه يعملُ ويخلصُ له»، ويتعلّمُ الأولادُ أنّ الوطنَ بيتٌ كبيرٌ نحفظُه بالعملِ والمحبّةِ، ويدعونَ اللهَ أن يحميَ الوطنَ ويديمَ فيه الأمنَ والرخاءَ."],"img":""},{"stem":"في أيِّ شيءٍ يتشابهُ فيصلٌ ووالدُه في النصِّ؟","opts":["كلاهما يعملُ مهندسًا","كلاهما يفخرُ بمشروعِ المربّعِ الجديدِ","كلاهما يريدُ السفرَ","كلاهما لم يُعجَبْ بالمشروعِ"],"ans":1,"ctx":["كانَ فيصلٌ يقفُ أمامَ لوحةٍ ضخمةٍ تُظهِرُ تصميمًا مذهلًا لمشروعٍ جديدٍ في قلبِ الرياضِ، فسألَ والدَه بدهشةٍ: أبي، ما هذه المباني التي تشبهُ مدنَ المستقبلِ؟","ابتسمَ الأبُ وقالَ بفخرٍ: هذا يا بنيّ مشروعُ «المربّعِ الجديدِ»، أحدُ مشاريعِ رؤيةِ السعوديّةِ 2030، وسيغيّرُ معالمَ الرياضِ ويجعلُها من أجملِ المدنِ في العالمِ.","سارَ فيصلٌ ووالدُه في أرجاءِ المعرضِ، فشاهدا مجسّماتٍ للمشروعِ، ومهندسينَ يعملونَ على تصاميمَ تجمعُ بينَ الحداثةِ والهويّةِ السعوديّةِ. قالَ الأبُ: سيُقامُ هنا مجمّعٌ كبيرٌ للشققِ والفنادقِ والمتاجرِ والمراكزِ الترفيهيّةِ، وسيكونُ كلُّ شيءٍ متّصلًا بنظامِ نقلٍ داخليٍّ ذكيٍّ يسهّلُ على السكّانِ الوصولَ إلى أيِّ مكانٍ.","نظرَ فيصلٌ إلى الأفقِ وقالَ بإعجابٍ: مشروعٌ عظيمٌ يا أبي! سيصبحُ المربّعُ الجديدُ كأنّه بوّابةٌ إلى المستقبلِ.","وفي نهايةِ الجولةِ قالَ فيصلٌ: يا أبي، سأدرسُ الهندسةَ لأساهمَ في بناءِ مشاريعَ جديدةٍ، وأكونَ جزءًا من رؤيةِ السعوديّةِ 2030."],"img":""}]},{"start":"2026-12-06","sec":0,"q":[{"stem":"الكلمةُ المناسبةُ لإتمامِ الجملةِ السابقةِ هي:","opts":["يُخالِفون","يُهمِلون","يَسيرون","يَشكُرون"],"ans":2,"ctx":["لعلَّ جيلَ اليومِ يعترفونَ بفضلِ العالِمِ، و.......... على خُطاه."],"img":""},{"stem":"إلى أيِّ فئةٍ تنتمي كلمةُ (القِصَص)؟","opts":["اسم – مؤنَّث – جمع","فعل – مذكَّر – مفرد","حرف – مؤنَّث – مثنًّى","اسم – مذكَّر – مفرد"],"ans":0,"ctx":["تعلَّمَ التلاميذُ من القِصَصِ أنَّ الكلمةَ الطيّبةَ تصنعُ يومًا جميلًا."],"img":""},{"stem":"ما السببُ الرئيسُ الذي جعلَ المدرسةَ تنظّمُ حملةَ زراعةِ الأشجارِ؟","opts":["تنظيمُ مسابقةٍ بينَ الصفوفِ","الاحتفالُ باليومِ الوطنيِّ","تزيينُ المدرسةِ فقط","زيادةُ المساحاتِ الخضراءِ وتوعيةُ الطلابِ بأهميّةِ الحفاظِ على البيئةِ"],"ans":3,"ctx":["في يومٍ من الأيّامِ نظّمتِ المدرسةُ حملةً لزراعةِ الأشجارِ في حديقتِها، وشاركَ جميعُ الطلابِ والمعلّمينَ في الحملةِ بحماسٍ. كانَ الهدفُ من الحملةِ زيادةَ المساحاتِ الخضراءِ وتوعيةَ الطلابِ بأهميّةِ الحفاظِ على البيئةِ. وبعدَ انتهاءِ الحملةِ شعرَ الجميعُ بالسعادةِ والفخرِ بما أنجزوه."],"img":""},{"stem":"ما رأيُك في عبارةِ «الوطنُ بيتٌ كبيرٌ»؟","opts":["تعبيرٌ رائعٌ يعلّمُنا المسؤوليّةَ","عبارةٌ غيرُ واضحةٍ","لا معنى لها","تجعلُني أشعرُ بالمللِ"],"ans":0,"ctx":["يحبُّ الأولادُ وطنَهم السعوديّةَ؛ فهي أرضُ الأمنِ والعزِّ. ويتذكّرُ الناسُ يومَ التأسيسِ الذي بدأَ فيه المجدُ والعمارُ، حينَ أسّسَ الإمامُ محمّدُ بنُ سعودٍ – رحمَه اللهُ – الدولةَ الأولى في الدرعيّةِ. كانَ الناسُ يتعاونونَ ويعملونَ بجدٍّ لبناءِ وطنٍ قويٍّ.","وفي يومِ التأسيسِ يفرحُ الأطفالُ، فيرتدونَ اللباسَ التراثيَّ، ويرفعونَ العلمَ بفخرٍ، وتتزيّنُ المدارسُ بالألوانِ والأناشيدِ الوطنيّةِ.","يقولُ المعلّمُ: «مَن يحبُّ وطنَه يعملُ ويخلصُ له»، ويتعلّمُ الأولادُ أنّ الوطنَ بيتٌ كبيرٌ نحفظُه بالعملِ والمحبّةِ، ويدعونَ اللهَ أن يحميَ الوطنَ ويديمَ فيه الأمنَ والرخاءَ."],"img":""},{"stem":"العنصرُ الرئيسُ الذي يجمعُ بينَ الأحداثِ في النصِّ هو:","opts":["لعبةٌ في الساحةِ","يومٌ دراسيٌّ في حياةِ عليٍّ","رحلةٌ إلى الحديقةِ","حفلٌ في المدرسةِ"],"ans":1,"ctx":["استيقظَ عليٌّ في صباحِ يومٍ مشمسٍ، وجهّزَ نفسَه للذهابِ إلى المدرسةِ. بعدَ تناولِ وجبةِ الإفطارِ حملَ حقيبتَه وخرجَ مسرعًا. وفي الطريقِ التقى صديقَه أحمدَ، وأخذا يتبادلانِ الحديثَ عن الدروسِ والأنشطةِ المدرسيّةِ. وعندَ وصولِهما إلى المدرسةِ بدأَ الطابورُ الصباحيُّ، ثمّ دخلَ الطلابُ إلى فصولِهم لبدايةِ الحصصِ الدراسيّةِ."],"img":""}]},{"start":"2026-12-13","sec":1,"q":[{"stem":"إذا تعاونَ الأطفالُ في المدرسةِ، فماذا سيحدثُ؟","opts":["سيشعرونَ بالمللِ","سيتنافرونَ","سيتأخّرُ إنجازُ الدروسِ","سيزدادُ الفهمُ ويصبحُ الدرسُ ممتعًا"],"ans":3,"ctx":["يعيشُ الناسُ في المجتمعِ معًا، ويحتاجونَ إلى بعضِهم في حياتِهم اليوميّةِ، والتعاونُ يساعدُ الجميعَ على إنجازِ الأعمالِ بسهولةٍ وسرعةٍ.","عندما يتعاونُ الأطفالُ في المدرسةِ يصبحُ الدرسُ ممتعًا ويزدادُ الفهمُ، وكذلك التعاونُ بينَ الجيرانِ يجعلُ الحيَّ نظيفًا وآمنًا.","ويستطيعُ الأطفالُ مشاركةَ الألعابِ والكتبِ معَ أصدقائِهم ليتعلّموا المشاركةَ والعطاءَ. فالتعاونُ قيمةٌ مهمّةٌ تجعلُ المجتمعَ أقوى وأكثرَ ترابطًا."],"img":""},{"stem":"إذا كانَ القطُّ مريضًا جدًّا، فما الحلُّ المناسبُ الذي يمكنُ أن يقومَ به سامي؟","opts":["يتركُه ويذهبُ","يغطّيه وينساه","يأخذُه إلى الطبيبِ البيطريِّ","يخبرُ أصدقاءَه فقط"],"ans":2,"ctx":["كانَ الطفلُ سامي يسيرُ في طريقِ المدرسةِ، فسمعَ صوتَ قطٍّ صغيرٍ يبكي تحتَ الشجرةِ. توقّفَ سامي ونظرَ إليه، فوجدَه جائعًا يرتعشُ من البردِ، فأخذَه بلطفٍ ووضعَه في صندوقٍ صغيرٍ وغطّاه بقطعةِ قماشٍ دافئةٍ. وعندما وصلَ إلى المدرسةِ أخبرَ معلّمَه بما فعلَ، فابتسمَ المعلّمُ وقالَ: «هذه هي الرحمةُ الحقيقيّةُ».","بعدَ الدراسةِ أخذَ سامي القطَّ إلى البيتِ وأعطاه الطعامَ والماءَ، فأحبَّه القطُّ وبقيَ معه يلعبُ كلَّ يومٍ. شعرَ سامي بالسعادةِ لأنّه أنقذَ مخلوقًا ضعيفًا، وقالتْ له أمُّه: «مَن يرحمِ الناسَ والحيواناتِ يرحمْه اللهُ».","شكرَ سامي أمَّه ووعدَها أن يكونَ رحيمًا دائمًا، فصارَ كلُّ مَن يعرفُه يقولُ: «سامي صاحبُ القلبِ الرحيمِ»."],"img":""},{"stem":"السياقُ المناسبُ لكلمةِ (القاحلة) من الجملِ التاليةِ هو:","opts":["زارَ أحمدُ الصحراءَ ..........","سُعِدْتُ بمنظرِ .......... البحرِ.","شاهدَ خالدٌ الشلّالَ ..........","ركبَ عادلٌ الطائرةَ .........."],"ans":0,"ctx":[],"img":""},{"stem":"ما رأيُك في أثرِ النصِّ؟","opts":["يسبّبُ المللَ","يُشعِرُ بالفخرِ وحبِّ الوطنِ","يحثُّ على تركِ الرياضةِ","لا يؤثّرُ أبدًا"],"ans":1,"ctx":["منتخبُنا السعوديُّ فخرُ الوطنِ. يحبُّ أبناءُ المملكةِ العربيّةِ السعوديّةِ لعبةَ كرةِ القدمِ؛ فهي لعبةٌ جميلةٌ تعلّمُنا التعاونَ والإخلاصَ والاجتهادَ. ومنتخبُنا السعوديُّ يمثّلُ وطنَنا في الملاعبِ الدوليّةِ.","يلعبُ اللاعبونَ بحبٍّ وحماسٍ لرفعِ العلمِ السعوديِّ عاليًا، ونفرحُ جميعًا عندما يحقّقُ المنتخبُ الفوزَ في المبارياتِ، ونشجّعُه بالهتافِ ورفعِ العلمِ فخرًا واعتزازًا.","ويعلّمُنا اللاعبونَ أن نجتهدَ ونعملَ كفريقٍ واحدٍ، كما يعلّمونَنا الأدبَ الرياضيَّ واحترامَ الفريقِ الآخرِ. فالفوزُ الحقيقيُّ هو أن نكونَ مثالًا في الأخلاقِ والعطاءِ."],"img":""},{"stem":"ما الهدفُ الرئيسُ الذي يستندُ إليه النصُّ؟","opts":["كرةُ القدمِ لعبةٌ متعبةٌ","اللاعبونَ يسافرونَ كثيرًا","المنتخبُ السعوديُّ يمثّلُ الوطنَ","الناسُ لا يحبّونَ المبارياتِ"],"ans":2,"ctx":["منتخبُنا السعوديُّ فخرُ الوطنِ. يحبُّ أبناءُ المملكةِ العربيّةِ السعوديّةِ لعبةَ كرةِ القدمِ؛ فهي لعبةٌ جميلةٌ تعلّمُنا التعاونَ والإخلاصَ والاجتهادَ. ومنتخبُنا السعوديُّ يمثّلُ وطنَنا في الم const SECS = DATA.secs, WEEKS = DATA.weeks;
const VALS = [20,15,10,5,0];
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = ['أ','ب','جـ','د'];
const app = document.getElementById('app');
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function devId(){ let d = LS.get('nq_dev'); if(!d){ d = Math.random().toString(36).slice(2,10); LS.set('nq_dev', d); } return d; }

// الأسبوع الحالي حسب تواريخ البداية (بتوقيت الرياض)
function weekIndex(){
  const now = Date.now();
  let idx = -1;
  WEEKS.forEach((w, i) => { if(now >= Date.parse(w.start + 'T00:00:00+03:00')) idx = i; });
  return idx;
}
const FMT = new Intl.DateTimeFormat('ar-SA-u-ca-gregory', {day:'numeric', month:'long', timeZone:'Asia/Riyadh'});
const fmtDate = s => FMT.format(new Date(s + 'T12:00:00+03:00'));

let ROWS = null, BOARD_ERR = '';
async function loadBoard(){
  if(!API || API.indexOf('__') === 0){ BOARD_ERR = 'لوحة الشرف المشتركة لم تُربط بعد، فتظهر هنا نتائج هذا الجهاز فقط.'; ROWS = []; return; }
  try{
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(API + '?action=board&t=' + Date.now(), {signal: ctl.signal});
    clearTimeout(t);
    const j = await r.json();
    ROWS = (j.rows || []).map(x => ({week:+x.week, name:String(x.name), cls:String(x.cls||''), score:+x.score, secs:+x.secs}));
    BOARD_ERR = '';
  }catch(e){ BOARD_ERR = 'تعذّر تحميل لوحة الشرف الآن.'; if(!ROWS) ROWS = []; }
}
function rank(list){
  return list.sort((a,b) => b.score - a.score || a.secs - b.secs || a.name.localeCompare(b.name, 'ar'));
}
function localRows(){
  const out = [];
  WEEKS.forEach((_, i) => { const d = LS.get('nq_done_' + (i+1)); if(d) out.push({week:i+1, name:d.name, cls:d.cls, score:d.score, secs:d.secs}); });
  return out;
}
function allData(){
  const base = (ROWS || []).slice();
  localRows().forEach(l => { if(!base.some(r => r.week === l.week && r.name.trim() === l.name.trim())) base.push(l); });
  return base;
}
function weekRows(w){ return rank(allData().filter(r => r.week === w)); }
function allRows(){
  const m = {};
  allData().forEach(r => { const k = r.name.trim(); if(!m[k]) m[k] = {name:k, cls:r.cls, score:0, secs:0, n:0}; m[k].score += r.score; m[k].secs += r.secs; m[k].n++; });
  return rank(Object.values(m));
}
function tableHTML(list, me, total){
  if(!list.length) return '<div class="empty">لم يُكمل أحد بعد. كن أول الأبطال!</div>';
  return '<table><thead><tr><th>#</th><th>الاسم</th><th>الفصل</th><th>' + (total ? 'المجموع' : 'الدرجة') + '</th></tr></thead><tbody>' +
    list.slice(0, 20).map((r, i) => '<tr class="' + (me && r.name === me ? 'me' : '') + '"><td class="r">' + (i < 3 ? '<span class="medal m' + (i+1) + '">' + AR(i+1) + '</span>' : AR(i+1)) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.cls) + '</td><td>' + AR(r.score) + (total ? ' <small style="color:#5F7078">(' + AR(r.n) + ' أسابيع)</small>' : '') + '</td></tr>').join('') +
    '</tbody></table>';
}
let boardTab = 'cur';
function boardHTML(wi, me){
  const tabs = [['cur','هذا الأسبوع']];
  if(wi > 0) tabs.push(['prev','الأسبوع السابق']);
  tabs.push(['all','الترتيب العام']);
  if(!tabs.some(t => t[0] === boardTab)) boardTab = 'cur';
  let body;
  if(ROWS === null) body = '<div class="empty">جارٍ تحميل لوحة الشرف…</div>';
  else if(boardTab === 'cur') body = tableHTML(weekRows(wi + 1), me);
  else if(boardTab === 'prev') body = tableHTML(weekRows(wi), me);
  else body = tableHTML(allRows(), me, true);
  return '<div class="card" id="board"><h2>🏅 لوحة الشرف</h2><div class="tabs">' + tabs.map(t => '<button data-tab="' + t[0] + '" class="' + (t[0] === boardTab ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</div>' + body +
    (BOARD_ERR ? '<div class="note">' + BOARD_ERR + '</div>' : '') + '</div>';
}
function wireTabs(rerender){
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { boardTab = b.dataset.tab; rerender(); });
}

// ===== الشاشة الأولى =====
function home(){
  const wi = weekIndex();
  if(wi < 0){
    app.innerHTML = '<div class="card center"><h2>يبدأ التحدّي يوم الأحد ' + fmtDate(WEEKS[0].start) + '</h2><p>استعدّ!</p></div>';
    return;
  }
  const w = WEEKS[wi];
  const done = LS.get('nq_done_' + (wi+1));
  const prof = LS.get('nq_prof', {name:'', cls:''});
  let h = '<a class="btn alt" href="#board" style="text-decoration:none;text-align:center;margin:0 0 14px">🏅 لوحة الشرف</a><div class="ind"><div class="k">📌 محور الأسبوع ' + AR(wi+1) + '</div><div class="v">' + esc(SECS[w.sec]) + '</div></div>';
  if(done){
    h += '<div class="card center"><h2>أحسنت يا ' + esc(done.name) + '!</h2><div class="big">' + AR(done.score) + '<small> / ١٠٠</small></div><p>أنهيت تحدّي هذا الأسبوع. تتغيّر الأسئلة يوم الأحد القادم.</p></div>';
  }else{
    h += '<div class="card"><div class="wk"><span>الأسبوع ' + AR(wi+1) + ' • بدأ الأحد ' + fmtDate(w.start) + '</span><span class="pill">' + AR(w.q.length) + ' أسئلة</span></div>' +
      '<label for="nm">اسم الطالب (الاسم الثلاثي)</label><input id="nm" autocomplete="name" value="' + esc(prof.name) + '" placeholder="مثال: محمد أحمد علي">' +
      '<label for="cl">الفصل</label><select id="cl"><option value="">اختر الفصل</option>' + ['٣/١','٣/٢','٣/٣','٣/٤'].map(c => '<option' + (prof.cls === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select>' +
      '<div class="err" id="er"></div><button class="btn" id="go">ابدأ التحدّي</button>' +
      '<div class="note">كل سؤال قيمته ٢٠ نقطة، وتقلّ مع كل محاولة خاطئة. لا تنتقل للسؤال التالي إلا بعد الإجابة الصحيحة.</div></div>';
  }
  h += boardHTML(wi, done ? done.name : null);
  app.innerHTML = h;
  wireTabs(home);
  const go = document.getElementById('go');
  if(go) go.onclick = () => {
    const name = document.getElementById('nm').value.replace(/\s+/g, ' ').trim();
    const cls = document.getElementById('cl').value;
    const er = document.getElementById('er');
    if(name.split(' ').length < 2){ er.textContent = 'اكتب اسمك الثنائي أو الثلاثي.'; return; }
    if(!cls){ er.textContent = 'اختر الفصل.'; return; }
    LS.set('nq_prof', {name, cls});
    play(wi, name, cls);
  };
}

let audio;
function beep(f, d){ try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; g.gain.value = .06; o.connect(g); g.connect(audio.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d); o.stop(audio.currentTime + d); }catch(e){} }

      '<div class="bar">' + w.q.map((_, j) => '<i class="' + (j < S.i ? 'ok' : j === S.i ? 'on' : '') + '"></i>').join('') + '</div>' +
      (it.ctx && it.ctx.length ? '<div class="passage">' + it.ctx.map(p => '<p>' + esc(p) + '</p>').join('') + '</div>' : '') +

      '<div class="stem">' + esc(it.stem) + '</div>' +
      it.opts.map((o, j) => '<button class="opt' + (S.wrong.includes(j) ? ' bad' : '') + '" data-j="' + j + '"' + (S.wrong.includes(j) ? ' disabled' : '') + '><b>' + LETTERS[j] + '</b><span>' + esc(o) + '</span></button>').join('') +
      '<div class="vals">قيمة السؤال الآن: ' + VALS.map((v, k) => '<span class="' + (k === Math.min(S.tries, 4) ? 'cur' : '') + '">' + AR(v) + '</span>').join('') + '</div>' +
      '</div>';
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.j, b));
    window.scrollTo(0, 0);
  }
  function pick(j, b){
    const it = w.q[S.i];
    if(j === it.ans){
      S.score += VALS[Math.min(S.tries, 4)];
      b.classList.add('ok'); beep(660, .25); setTimeout(() => beep(880, .3), 120);
      app.querySelectorAll('.opt').forEach(x => x.disabled = true);
      setTimeout(() => { S.i++; S.tries = 0; S.wrong = []; if(S.i < w.q.length) render(); else finish(); }, 850);
    }else{
      S.tries++; S.wrong.push(j); beep(220, .3);
      render();
    }
  }
  async function finish(){
    const secs = Math.round((Date.now() - S.t0) / 1000);
    const rec = {name, cls, score:S.score, secs, week:wi+1};
    LS.set('nq_done_' + (wi+1), rec);
    app.innerHTML = '<div class="card center"><div class="cert"><div class="t">شهادة إتقان</div><div>يسرّنا أن نهنّئ البطل</div><div class="n">' + esc(name) + '</div><div>لإكماله تحدّي نُتقن الأسبوعي (لغتي) – الأسبوع ' + AR(wi+1) + '</div><div class="big">' + AR(S.score) + '<small> / ١٠٠</small></div><div style="color:#5F7078;font-size:14px">الوقت: ' + AR(Math.floor(secs/60)) + ' د ' + AR(secs%60) + ' ث</div></div><div class="note" id="sv">جارٍ حفظ نتيجتك في لوحة الشرف…</div><button class="btn" id="hm">لوحة الشرف</button></div>';
    document.getElementById('hm').onclick = home;
    const sv = document.getElementById('sv');
    if(!API || API.indexOf('__') === 0){ sv.textContent = 'حُفظت نتيجتك على هذا الجهاز.'; return; }
    try{
      const q = new URLSearchParams({action:'submit', week:wi+1, name, cls, score:S.score, secs, dev:devId()});
      const r = await fetch(API + '?' + q.toString());
      const j = await r.json();
      sv.textContent = j.ok ? (j.dup ? 'نتيجتك لهذا الأسبوع مسجّلة من قبل.' : 'حُفظت نتيجتك في لوحة الشرف ✓') : 'تعذّر الحفظ، أخبر معلمك.';
      await loadBoard();
    }catch(e){ sv.textContent = 'تعذّر الاتصال بلوحة الشرف الآن، ونتيجتك محفوظة على هذا الجهاز.'; }
  }
  render();
}

home();
function refresh(){ loadBoard().then(() => { if(!document.querySelector('.opt') && !document.querySelector('.cert') && !(document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName))) home(); }); }
refresh();
// تحديث لوحة الشرف تلقائيًا كل ٣٠ ثانية ما دامت الصفحة مفتوحة
setInterval(() => { if(!document.hidden && API.indexOf('__') !== 0) refresh(); }, 30000);
</script>
