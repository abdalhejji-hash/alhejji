<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة نُتقن</title>

<style>
/* Layout: one centred column (max 560px), phone-first: start → subjects → map (3 sections × 3 levels) → questions → certificate */
:root{
  --bg:#EEF6F4; --surface:#FFFFFF; --ink:#173A40; --muted:#5C7377; --line:#D3E4E1;
  --s0:#0E9384; --s0-soft:#D6F2EE; --s1:#3B5BDB; --s1-soft:#DFE6FF; --s2:#E8590C; --s2-soft:#FFE4D3;
  --ar:#0E9384; --ar-soft:#D6F2EE; --ma:#3B5BDB; --ma-soft:#DFE6FF; --sc:#2F9E44; --sc-soft:#DDF3E1; --is:#7048E8; --is-soft:#E9E2FF;
  --gold:#F5B300; --ok:#2B9A4B; --ok-soft:#DDF5E3; --bad:#D9363E; --bad-soft:#FCE1E2; --lock:#AFC2C0;
  --display:"IBM Plex Sans Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1F22; --surface:#17302F; --ink:#E7F3F1; --muted:#9DB6B3; --line:#28474A;
  --s0:#3CC9B6; --s0-soft:#123E3A; --s1:#8AA2FF; --s1-soft:#1D2A55; --s2:#FF9A5C; --s2-soft:#4A2614;
  --ar:#3CC9B6; --ar-soft:#123E3A; --ma:#8AA2FF; --ma-soft:#1D2A55; --sc:#69DB7C; --sc-soft:#173E24; --is:#B197FC; --is-soft:#2E2452;
  --gold:#FFC93D; --ok:#5CD07D; --ok-soft:#173E24; --bad:#FF7A80; --bad-soft:#4A1C1F; --lock:#4E6865; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1F22; --surface:#17302F; --ink:#E7F3F1; --muted:#9DB6B3; --line:#28474A;
  --s0:#3CC9B6; --s0-soft:#123E3A; --s1:#8AA2FF; --s1-soft:#1D2A55; --s2:#FF9A5C; --s2-soft:#4A2614;
  --ar:#3CC9B6; --ar-soft:#123E3A; --ma:#8AA2FF; --ma-soft:#1D2A55; --sc:#69DB7C; --sc-soft:#173E24; --is:#B197FC; --is-soft:#2E2452;
  --gold:#FFC93D; --ok:#5CD07D; --ok-soft:#173E24; --bad:#FF7A80; --bad-soft:#4A1C1F; --lock:#4E6865; color-scheme:dark}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px}
.btn{border:0;border-radius:16px;padding:14px 20px;font-size:20px;font-weight:700;background:var(--ink);color:var(--bg);font-family:var(--display)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.school{font-size:14px;color:var(--muted);font-weight:700;text-align:center;line-height:1.5}
.badge{align-self:center;background:var(--s0-soft);color:var(--s0);border:1.5px solid var(--s0);border-radius:999px;padding:2px 14px;font-weight:700;font-size:14px}
/* start */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:6px}
.hero h1{font-size:46px;color:var(--ink)}
.hero h1 span{color:var(--s0)}
.hero p{margin:0;color:var(--muted);font-weight:700}
.path{display:flex;gap:8px;justify-content:center;margin:4px 0}
.path i{width:14px;height:14px;border-radius:50%;display:block}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input,.field select{font:inherit;font-size:19px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.field small{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 4px;font-size:18px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--s0);background:var(--s0-soft);color:var(--s0)}
/* subjects */
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who b{font-family:var(--display);font-size:22px}
.total{font-weight:700;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{border:2px solid var(--c);background:var(--cs);border-radius:22px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);text-align:center}
.sub .ic{width:56px;height:56px;border-radius:18px;background:var(--c);color:var(--surface);display:grid;place-items:center;font-size:28px}
.sub h2{font-size:23px;color:var(--c)}
.sub .pg{width:100%;height:10px;border-radius:99px;background:var(--surface);overflow:hidden}.sub .pg i{display:block;height:100%;background:var(--c)}
.sub small{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sub .done{background:var(--gold);color:#173A40;border-radius:999px;padding:0 10px;font-size:14px;font-weight:700}
/* map */
.sec{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--c);background:var(--cs)}
.sec header{display:flex;align-items:center;gap:12px}
.sec .ic{width:46px;height:46px;border-radius:14px;background:var(--c);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:700;flex:0 0 auto}
.sec h2{font-size:23px;color:var(--c)}
.sec header p{margin:0;color:var(--muted);font-size:15px;font-weight:700}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv{border-radius:16px;background:var(--surface);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);border:2px solid transparent}
.lv .n{font-family:var(--display);font-size:26px;font-weight:700;color:var(--c);line-height:1}
.lv .t{font-weight:700;font-size:15px}
.lv .st{font-size:18px;letter-spacing:2px;color:var(--gold);min-height:1.2em}
.lv.next{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.lv.locked{opacity:.55;cursor:not-allowed}.lv.locked .n{color:var(--lock)}
.lv .sc{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qtop .tag{background:var(--c);color:var(--surface);border-radius:999px;padding:4px 14px;font-weight:700;font-family:var(--display)}
.qtop .x{background:none;border:0;color:var(--muted);font-weight:700;font-size:16px}
.dots{display:flex;gap:6px}.dots i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--c)}.dots i.okd{background:var(--ok)}.dots i.badd{background:var(--bad)}
.passage{background:var(--cs);border-radius:18px;padding:12px 16px;border:1.5px dashed var(--c)}
.passage .ph{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--c)}
.passage .ph button{background:none;border:0;color:var(--c);font-weight:700;font-size:15px}
.passage p{margin:6px 0 0;font-size:19px;line-height:1.85}
.passage.closed p{display:none}
.qimg{display:block;margin:0 auto;border-radius:14px;max-height:200px;max-width:100%}
.stem{font-family:var(--display);font-size:25px;font-weight:700;line-height:1.55;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:20px;font-weight:700;color:var(--ink)}
.opt .l{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--cs);color:var(--c);font-family:var(--display);font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .l{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .l{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:10px 14px;font-weight:700;font-size:19px;text-align:center}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* level result */
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stars{font-size:46px;letter-spacing:6px;color:var(--gold)}
.off{color:var(--line)}
.res .row{width:100%}
/* final */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 56px;align-items:center;gap:10px;font-weight:700}
.bar .tr{height:14px;border-radius:99px;background:var(--line);overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar span:last-child{text-align:left;font-variant-numeric:tabular-nums}
#cert{width:100%;border-radius:12px;border:1.5px solid var(--line);display:block}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:0}
.wa{display:flex;flex-direction:column;gap:8px}
.wa a{display:block;text-align:center;text-decoration:none;background:#1FA855;color:#fff;border-radius:16px;padding:14px;font-family:var(--display);font-weight:700;font-size:20px}
.msg{white-space:pre-wrap;background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:420px){.hero h1{font-size:38px}.stem{font-size:22px}.opt{font-size:18px}.bar{grid-template-columns:104px 1fr 48px}.sub h2{font-size:20px}}
</style></head><body>

pts": ["لأنّه ينشّطُ الجسمَ ويساعدُ على الهضمِ", "لأنّه يسبّبُ الجفافَ", "لأنّه يُضعِفُ العضلاتِ", "لأنّه يزيدُ الألمَ"], "ans": 0, "ctx": ["شربُ الماءِ مفيدٌ للجسمِ؛ فهو يساعدُ في ترطيبِ الجلدِ، وينشّطُ الجسمَ، ويساعدُ على الهضمِ. ويجبُ أن نشربَ كمّيّةً كافيةً من الماءِ يوميًّا، خاصّةً في الأيّامِ الحارّةِ أو بعدَ اللعبِ؛ لأنّ الجسمَ يحتاجُ إلى ترطيبٍ. الماءُ هو أفضلُ مشروبٍ لصحّةِ الجسمِ."], "img": null}, {"sec": 1, "lvl": 1, "stem": "يستحقُّ المنتخبُ السعوديُّ أن يُوصَفَ بأنّه «فخرُ الوطنِ» لأنّه:", "opts": ["يلعبُ كلَّ يومٍ", "يسافرُ إلى الدولِ الأخرى", "يمثّلُ الوطنَ باجتهادٍ وأخلاقٍ", "يربحُ دائمًا"], "ans": 2, "ctx": ["منتخبُنا السعوديُّ فخرُ الوطنِ. يحبُّ أبناءُ المملكةِ العربيّةِ السعوديّةِ لعبةَ كرةِ القدمِ؛ فهي لعبةٌ جميلةٌ تعلّمُنا التعاونَ والإخلاصَ والاجتهادَ. ومنتخبُنا السعوديُّ يمثّلُ وطنَنا في الملاعبِ الدوليّةِ.", "يلعبُ اللاعبونَ بحبٍّ وحماسٍ لرفعِ العلمِ السعوديِّ عاليًا، ونفرحُ جميعًا عندما يحقّقُ المنتخبُ الفوزَ في المبارياتِ، ونشجّعُه بالهتافِ ورفعِ العلمِ فخرًا واعتزازًا.", "ويعلّمُنا اللاعبونَ أن نجتهدَ ونعملَ كفريقٍ واحدٍ، كما يعلّمونَنا الأدبَ الرياضيَّ واحترامَ الفريقِ الآخرِ. فالفوزُ الحقيقيُّ هو أن نكونَ مثالًا في الأخلاقِ والعطاءِ."], "img": null}, {"sec": 1, "lvl": 1, "stem": "الشخصيّاتُ الواردةُ في النصِّ:", "opts": ["الدبُّ فيلكس – أصدقاؤه الحيوانات", "العصافيرُ – القردُ", "فوّاز – والدُه", "المعلّم – الطالب"], "ans": 0, "ctx": ["في أقاصي القطبِ الشماليِّ الباردةِ، حيثُ تتساقطُ الثلوجُ بغزارةٍ، كانَ هناكَ دبٌّ قطبيٌّ ذو فراءٍ أبيضَ كاللؤلؤِ وعينينِ زرقاوينِ كالسماءِ الصافيةِ، اسمُه فيلكس.", "لم يكنْ فيلكس دبًّا عاديًّا؛ فقد كانتْ لديه قدرةٌ فريدةٌ على تغييرِ لونِ فرائِه حسبَ مشاعرِه، فعندما يكونُ سعيدًا يصبحُ فراؤه زاهيًا، وعندما يكونُ حزينًا أو خائفًا يتحوّلُ إلى لونٍ داكنٍ. واستخدمَ فيلكس قدرتَه هذه للتواصلِ معَ أصدقائِه من الحيواناتِ القطبيّةِ.", "وفي أحدِ الأيّامِ احتفلتْ مجموعةٌ كبيرةٌ من الحيواناتِ بالدبِّ فيلكس الذي أضافَ السعادةَ والألوانَ إلى عالمِهم الثلجيِّ."], "img": null}, {"sec": 1, "lvl": 1, "stem": "هل كانَ وصفُ يومِ التأسيسِ في النصِّ كاملًا؟", "opts": ["غيرُ كاملٍ", "لا، لأنّه لم يذكرِ العلمَ", "غيرُ واضحٍ", "نعم، لأنّه ذكرَ فرحَ الناسِ وأناشيدَهم"], "ans": 3, "ctx": ["يحبُّ الأولادُ وطنَهم السعوديّةَ؛ فهي أرضُ الأمنِ والعزِّ. ويتذكّرُ الناسُ يومَ التأسيسِ الذي بدأَ فيه المجدُ والعمارُ، حينَ أسّسَ الإمامُ محمّدُ بنُ سعودٍ – رحمَه اللهُ – الدولةَ الأولى في الدرعيّةِ. كانَ الناسُ يتعاونونَ ويعملونَ بجدٍّ لبناءِ وطنٍ قويٍّ.", "وفي يومِ التأسيسِ يفرحُ الأطفالُ، فيرتدونَ اللباسَ التراثيَّ، ويرفعونَ العلمَ بفخرٍ، وتتزيّنُ المدارسُ بالألوانِ والأناشيدِ الوطنيّةِ.", "يقولُ المعلّمُ: «مَن يحبُّ وطنَه يعملُ ويخلصُ له»، ويتعلّمُ الأولادُ أنّ الوطنَ بيتٌ كبيرٌ نحفظُه بالعملِ والمحبّةِ، ويدعونَ اللهَ أن يحميَ الوطنَ ويديمَ فيه الأمنَ والرخاءَ."], "img": null}, {"sec": 1, "lvl": 1, "stem": "السببُ الذي يجعلُ معرضَ الكتابِ فرصةً رائعةً للطلابِ هو:", "opts": ["اللعبُ معَ الأصدقاءِ", "شراءُ الألعابِ", "نشرُ الثقافةِ وتحفيزُ الطلابِ على القراءةِ", "التسليةُ والمرحُ فقط"], "ans": 2, "ctx": ["تستضيفُ المدرسةُ كلَّ عامٍ معرضًا للكتابِ، تُعرَضُ فيه أنواعٌ متعدّدةٌ من الكتبِ التي تناسبُ جميعَ الأعمارِ. ويشجّعُ المعرضُ الطلابَ على القراءةِ، ويمنحُهم فرصةَ اقتناءِ كتبٍ جديدةٍ.", "ويُعَدُّ هذا المعرضُ فرصةً رائعةً لنشرِ الثقافةِ وتحفيزِ الطلابِ على الاهتمامِ بالقراءةِ والتعلّمِ."], "img": null}, {"sec": 1, "lvl": 1, "stem": "هل يكفي أن نحبَّ الوطنَ بالكلامِ؟", "opts": ["لا، بل بالعملِ والإخلاصِ كما في النصِّ", "نعم، الكلامُ يكفي", "نغنّي فقط", "نرفعُ الشعارَ بلا عملٍ"], "ans": 0, "ctx": ["يحبُّ الأولادُ وطنَهم السعوديّةَ؛ فهي أرضُ الأمنِ والعزِّ. ويتذكّرُ الناسُ يومَ التأسيسِ الذي بدأَ فيه المجدُ والعمارُ، حينَ أسّسَ الإمامُ محمّدُ بنُ سعودٍ – رحمَه اللهُ – الدولةَ الأولى في الدرعيّةِ. كانَ الناسُ يتعاونونَ ويعملونَ بجدٍّ لبناءِ وطنٍ قويٍّ.", "وفي يومِ التأسيسِ يفرحُ الأطفالُ، فيرتدونَ اللباسَ التراثيَّ، ويرفعونَ العلمَ بفخرٍ، وتتزيّنُ المدارسُ بالألوانِ والأناشيدِ الوطنيّةِ.", "يقولُ المعلّمُ: «مَن يحبُّ وطنَه يعملُ ويخلصُ له»، ويتعلّمُ الأولادُ أنّ الوطنَ بيتٌ كبيرٌ نحفظُه بالعملِ والمحبّةِ، ويدعونَ اللهَ أن يحميَ الوطنَ ويديمَ فيه الأمنَ والرخاءَ."], "img": null}, {"sec": 1, "lvl": 1, "stem": "هل تبدو المعلوماتُ في النصِّ مرتّبةً ومنظّمةً؟", "opts": ["لا، لأنّها ممتلئةٌ بالأسماءِ", "لا، لأنّها مشتّتةٌ", "نعم، لأنّها كثيرةٌ جدًّا", "نعم، لأنّها تبدأُ من الحبِّ وتنتهي بالقيمِ"], "ans": 3, "ctx": ["منتخبُنا السعوديُّ فخرُ الوطنِ. يحبُّ أبناءُ المملكةِ العربيّةِ السعوديّةِ لعبةَ كرةِ القدمِ؛ فهي لعبةٌ جميلةٌ تعلّمُنا التعاونَ والإخلاصَ والاجتهادَ. ومنتخبُنا السعوديُّ يمثّلُ وطنَنا في الملاعبِ الدوليّةِ.", "يلعبُ اللاعبونَ بحبٍّ وحماسٍ لرفعِ العلمِ السعوديِّ عاليًا، ونفرحُ جميعًا عندما يحقّقُ المنتخبُ الفوزَ في المبارياتِ، ونشجّعُه بالهتافِ ورفعِ العلمِ فخرًا واعتزازًا.", "ويعلّمُنا اللاعبونَ أن نجتهدَ ونعملَ كفريقٍ واحدٍ، كما يعلّمونَنا الأدبَ الرياضيَّ واحترامَ الفريقِ الآخرِ. فالفوزُ الحقيقيُّ هو أن نكونَ مثالًا في الأخلاقِ والعطاءِ."], "img": null}, {"sec": 1, "lvl": 1, "stem": "الدليلُ على أنّ النصَّ يعطي معلوماتٍ حقيقيّةً أنّه:", "opts": ["يذكرُ ألوانَ الملابسِ", "يذكرُ أنّ المنتخبَ يمثّلُ الوطنَ في المبارياتِ الدوليّةِ", "يتحدّثُ عن الجوِّ", "يذكرُ أسماءَ اللاعبينَ"], "ans": 1, "ctx": ["منتخبُنا السعوديُّ فخرُ الوطنِ. يحبُّ أبناءُ المملكةِ العربيّةِ السعوديّةِ لعبةَ كرةِ القدمِ؛ فهي لعبةٌ جميلةٌ تعلّمُنا التعاونَ والإخلاصَ والاجتهادَ. ومنتخبُنا السعوديُّ يمثّلُ وطنَنا في الملاعبِ الدوليّةِ.", "يلعبُ اللاعبونَ بحبٍّ وحماسٍ لرفعِ العلمِ السعوديِّ عاليًا، ونفرحُ جميعًا عندما يحقّقُ المنتخبُ الفوزَ في المبارياتِ، ونشجّعُه بالهتافِ ورفعِ العلمِ فخرًا واعتزازًا.", "ويعلّمُنا اللاعبونَ أن نجتهدَ ونعملَ كفريقٍ واحدٍ، كما يعلّمونَنا الأدبَ الرياضيَّ واحترامَ الفريقِ الآخرِ. فالفوزُ الحقيقيُّ هو أن نكونَ مثالًا في الأخلاقِ والعطاءِ."], "img": null}, {"sec": 1, "lvl": 1, "stem": "رتّبِ الأفكارَ كما وردتْ في النصِّ: (١) اجتهادُ الطلابِ ومساعدتُهم زملاءَهم، (٢) جهودُ الملكِ عبدِالعزيزِ في توحيدِ البلادِ، (٣) فخرُ المواطنينَ بالعلمِ وحراسةُ الجنودِ للحدودِ.", "opts": ["١ – ٢ – ٣", "٣ – ١ – ٢", "٢ – ٣ – ١", "٣ – ٢ – ١"], "ans": 2, "ctx": ["المملكةُ العربيّةُ السعوديّةُ وط   <form class="card" id="f" style="display:flex;flex-direction:column;gap:14px" novalidate>
    <div class="field"><label for="nm">اسمك الثلاثي</label><input id="nm" autocomplete="name" value="${esc(S.name)}" placeholder="مثال: محمد أحمد العلي"></div>
    <div class="field"><label id="gl">صفّك</label><div class="seg" role="group" aria-labelledby="gl">${GRADES.map(x=>`<button type="button" data-g="${x.g}" aria-pressed="${x.g===g}">${x.n}</button>`).join('')}</div></div>
    <div class="row">
      <div class="field"><label for="cl">فصلك</label><select id="cl"></select></div>
      <div class="field"><label for="ph">جوال وليّ أمرك</label><input id="ph" inputmode="tel" dir="ltr" value="${esc(S.phone)}" placeholder="05xxxxxxxx"><small>لإرسال درجتك إليه في النهاية</small></div>
    </div>
    <p class="err" id="er"></p>
    <button class="btn wide" type="submit">ابدأ الرحلة</button>
  </form>
  <div class="card" style="display:flex;flex-direction:column;gap:8px">
    <h3 style="font-size:20px">كيف تلعب؟</h3>
    <div>اختر صفّك، ثم اختر المادة: لغتي أو الرياضيات أو العلوم أو الدراسات الإسلامية.</div>
    <div>في كل مادة ٣ فقرات، ولكل فقرة ٣ مستويات. بعد كل مستوى يُفتح المستوى الذي بعده.</div>
    <div>في نهاية كل مادة تحصل على درجتك من ${AR(TOTAL)} وشهادة شكر.</div>
  </div>`;
  const fillCls = () => { const cur = S.grade===g ? S.cls : ''; $('#cl').innerHTML = classes(g).map(v=>`<option value="${v}" ${cur===v?'selected':''}>${v||(g?'اختر فصلك':'اختر صفّك أوّلًا')}</option>`).join(''); };
  fillCls();
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ g=+b.dataset.g; app.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); fillCls(); });
  $('#f').onsubmit = e => {
    e.preventDefault();
    const nm = $('#nm').value.trim(), cl = $('#cl').value, ph = $('#ph').value.replace(/[^\d٠-٩]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    if(nm.split(/\s+/).length<2){ $('#er').textContent='اكتب اسمك الأوّل واسم أبيك على الأقل.'; $('#nm').focus(); return; }
    if(!g){ $('#er').textContent='اختر صفّك.'; return; }
    if(!cl){ $('#er').textContent='اختر فصلك.'; $('#cl').focus(); return; }
    if(ph && !/^05\d{8}$/.test(ph)){ $('#er').textContent='اكتب رقم الجوال بهذا الشكل: 05xxxxxxxx، أو اتركه فارغًا.'; $('#ph').focus(); return; }
    S.name=nm; S.grade=g; S.cls=cl; S.phone=ph; save(); viewSubjects();
  };
}

/* ---------- subjects ---------- */
function viewSubjects(){
  J = null;
  app.innerHTML = `<section class="hero">${SCHOOL}<h1>رحلة <span>نُتقن</span></h1></section>
  <div class="who"><b>${esc(S.name.split(/\s+/)[0])}، اختر مادّتك</b><span class="total">الصف ${gName(S.grade)} • ${S.cls}</span></div>
  <div class="subs">${SUBJ.map(s=>{const id=S.grade+'-'+s.s, has=BANK[id], d=doneCount(id), sc=totalScore(id);
    return `<button class="sub" data-id="${id}" style="--c:${s.c};--cs:${s.cs}" ${has?'':'disabled'}>
      <span class="ic" aria-hidden="true">${s.ic}</span><h2>${s.n}</h2>
      <span class="pg"><i style="width:${d/9*100}%"></i></span>
      <small>${d===9?'':d?'أنجزت '+AR(d)+' من ٩ مستويات':'٩ مستويات • ٢١ سؤالًا'}</small>
      ${d===9?`<span class="done">${AR(sc)} / ${AR(TOTAL)} ★</span>`:''}</button>`;}).join('')}</div>
  <button class="btn ghost wide" id="bk">تعديل الاسم أو الصف</button>`;
  app.querySelectorAll('.sub:not([disabled])').forEach(b=>b.onclick=()=>{ J=b.dataset.id; viewMap(); });
  $('#bk').onclick = viewStart;
  window.scrollTo({top:0});
}

/* ---------- map ---------- */
function viewMap(){
  const ni = nextIdx(), B = BANK[J], sj = subOf(J.split('-')[1]);
  app.innerHTML = `
  <div class="who"><div><div class="school" style="text-align:right">${jTitle(J)} • الصف ${gName(S.grade)}</div><b>${esc(S.name.split(/\s+/)[0])}، أهلًا بك!</b></div><span class="total">درجتك: ${AR(totalScore(J))} / ${AR(TOTAL)}</span></div>
  ${B.secs.map((s,si)=>`
  <section class="sec" style="--c:${SC[si].c};--cs:${SC[si].cs}">
    <header><div class="ic">${AR(si+1)}</div><div><h2>${esc(s.name)}</h2><p>${esc(s.desc)}</p></div></header>
    <div class="levels">${LV.map((l,li)=>{
      const k=si+'-'+li, idx=si*3+li, b=jb()[k], locked=idx>ni, isNext=idx===ni;
      return `<button class="lv ${locked?'locked':''} ${isNext?'next':''}" data-k="${k}" ${locked?'disabled aria-disabled="true"':''}>
        <span class="n">${locked?'🔒':AR(li+1)}</span><span class="t">${locked?'المستوى '+AR(li+1):'المستوى'}</span>
        <span class="st">${b!=null?starHTML(starsFor(b,LVN[li])):''}</span>
        <span class="sc">${b!=null?AR(b)+' / '+AR(LVN[li]):(isNext?'ابدأ هنا':'')}</span></button>`;}).join('')}</div>
  </section>`).join('')}
  ${ni>=ORDER.length?`<button class="btn wide" id="fin">اعرض شهادتي</button>`:''}
  <button class="btn ghost wide" id="bk">العودة إلى المواد</button>`;
  app.querySelectorAll('.lv:not(.locked)').forEach(b=>b.onclick=()=>startLevel(b.dataset.k));
  $('#bk').onclick = viewSubjects;
  if($('#fin')) $('#fin').onclick = viewFinal;
  window.scrollTo({top:0});
}

/* ---------- quiz ---------- */
let Q = null;
function startLevel(k){
  const [si,li] = k.split('-').map(Number);
  const pool = BANK[J].q.filter(d=>d.sec===si && d.lvl===li);
  Q = {k, si, li, items: shuffle(pool).slice(0,LVN[li]).map(d=>({...d, order:shuffle(d.opts.map((_,i)=>i))})), i:0, score:0, marks:[]};
  viewQ();
}
function viewQ(){
  const c = SC[Q.si], it = Q.items[Q.i], L = ['أ','ب','ج','د'];
  app.innerHTML = `
  <div style="--c:${c.c};--cs:${c.cs};display:flex;flex-direction:column;gap:14px" class="pop">
    <div class="qtop"><span class="tag">${esc(BANK[J].secs[Q.si].name)} • ${LV[Q.li]}</span><button class="x" id="ex">خروج ✕</button></div>
    <div class="dots">${Q.items.map((_,j)=>`<i class="${Q.marks[j]===true?'okd':Q.marks[j]===false?'badd':(j===Q.i?'on':'')}"></i>`).join('')}</div>
    <div class="school" style="text-align:right">السؤال ${AR(Q.i+1)} من ${AR(Q.items.length)}</div>
    ${it.ctx&&it.ctx.length?`<div class="passage" id="ps"><div class="ph"><span>اقرأ النصّ</span><button id="tg">إخفاء النصّ</button></div>${it.ctx.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`:''}
    ${it.img?`<img class="qimg" src="${it.img}" alt="صورة السؤال">`:''}
    <div class="stem">${esc(it.stem)}</div>
    <div class="opts">${it.order.map((oi,j)=>`<button class="opt" data-oi="${oi}"><span class="l">${L[j]}</span><span>${esc(it.opts[oi])}</span></button>`).join('')}</div>
    <div id="fbx"></div>
  </div>`;
  $('#ex').onclick = viewMap;
  if($('#tg')) $('#tg').onclick = () => { const p=$('#ps'); p.classList.toggle('closed'); $('#tg').textContent = p.classList.contains('closed')?'إظهار النصّ':'إخفاء النصّ'; };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
  window.scrollTo({top:0});
}
const PRAISE = ['أحسنت! إجابة صحيحة.','ممتاز! أنت بطل.','رائع! أجبت إجابة صحيحة.','أحسنت، استمرّ!'];
function answer(oi){
  const it = Q.items[Q.i], ok = oi===it.ans;
  Q.marks[Q.i]=ok; if(ok) Q.score++;
  app.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const v=+b.dataset.oi; if(v===it.ans) b.classList.add('ok'); else if(v===oi) b.classList.add('bad'); });
  const last = Q.i===Q.items.length-1;
  $('#fbx').innerHTML = `<div class="fb ${ok?'ok':'bad'} pop">${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'إجابتك غير صحيحة، والإجابة الصحيحة باللون الأخضر.'}</div>
    <button class="btn wide" id="nx" style="margin-top:10px">${last?'اعرض نتيجة المستوى':'السؤال التالي'}</button>`;
  app.querySelectorAll('.dots i')[Q.i].className = ok?'okd':'badd';
  $('#nx').focus();
  $('#nx').onclick = () => { if(last) finishLevel(); else { Q.i++; viewQ(); } };
}
function finishLevel(){
  const n = Q.items.length, prev = jb()[Q.k]; jb()[Q.k] = Math.max(prev??0, Q.score); save();
  const c = SC[Q.si], st = starsFor(Q.score,n), allDone = nextIdx()>=ORDER.length;
  const msg = st===3?'ممتاز! أتقنت هذا المستوى.':st===2?'أحسنت! أداء جميل.':st===1?'جيّد، ويمكنك أن تحاول مرّة أخرى لتحصل على نجوم أكثر.':'لا بأس، أعد المحاولة وستتحسّن.';
  app.innerHTML = `
  <div class="card res pop" style="--c:${c.c};--cs:${c.cs}">
    <span class="school">${esc(BANK[J].secs[Q.si].name)} • ${LV[Q.li]}</span>
    <div class="stars">${starHTML(st)}</div>
    <div class="big" style="color:${c.c}">${AR(Q.score)} / ${AR(n)}</div>
    <div style="font-weight:700;font-size:20px">${msg}</div>
    <div class="row"><button class="btn ghost" id="rt">أعد المستوى</button><button class="btn" id="go">${allDone?'اعرض شهادتي':'تابع الرحلة'}</button></div>
  </div>`;
  $('#rt').onclick = () => startLevel(Q.k);
  $('#go').onclick = () => allDone ? viewFinal() : viewMap();
}

/* ---------- final + certificate ---------- */
function secScore(si){ return [0,1,2].reduce((a,l)=>a+(jb()[si+'-'+l]||0),0); }
function hijri(){ try{ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date()); }catch(e){ return ''; } }
function fitText(x,t,maxW,size,weight){ let s=size; do{ x.font=`${weight} ${s}px "IBM Plex Sans Arabic"`; s-=2; }while(x.measureText(t).width>maxW && s>16); }
async function drawCert(){
  try{ await Promise.all([document.fonts.load('600 60px "IBM Plex Sans Arabic"'),document.fonts.load('700 30px "IBM Plex Sans Arabic"')]); }catch(e){}
  const W=1600,H=1130, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const sj = subOf(J.split('-')[1]), B = BANK[J];
  x.direction='rtl';
  x.fillStyle='#FFFDF8'; x.fillRect(0,0,W,H);
  x.strokeStyle=sj.hex; x.lineWidth=18; x.strokeRect(40,40,W-80,H-80);
  x.strokeStyle='#F5B300'; x.lineWidth=5; x.strokeRect(78,78,W-156,H-156);
  [[SC[0].hex,59,59],[SC[1].hex,W-59,59],[SC[2].hex,59,H-59],[SC[0].hex,W-59,H-59]].forEach(([col,cx,cy])=>{x.fillStyle=col;x.beginPath();x.arc(cx,cy,18,0,7);x.fill();});
  const T=(t,y,font,col,align='center',xx=W/2)=>{x.font=font;x.fillStyle=col;x.textAlign=align;x.fillText(t,xx,y);};
  T('المملكة العربية السعودية • وزارة التعليم',150,'700 30px "IBM Plex Sans Arabic"','#5C7377','right',W-130);
  T('إدارة التعليم بمحافظة الأحساء',192,'700 30px "IBM Plex Sans Arabic"','#5C7377','right',W-130);
  T('مدرسة حكيم بن حزام الابتدائية وملحقتها الطريبيل المتوسطة',234,'700 30px "IBM Plex Sans Arabic"','#5C7377','right',W-130);
  T(hijri(),150,'700 28px "IBM Plex Sans Arabic"','#5C7377','left',130);
  T('مبادرة نُتقن – النشاط الطلابي',192,'800 30px "IBM Plex Sans Arabic"','#0E9384','left',130);
  T('شهادة شكر وتقدير',350,'800 96px "IBM Plex Sans Arabic"','#173A40');
  T('تتقدّم إدارة المدرسة بالشكر والتقدير للطالب',450,'700 40px "IBM Plex Sans Arabic"','#173A40');
  fitText(x,S.name,W-300,76,800); x.fillStyle=sj.hex; x.textAlign='center'; x.fillText(S.name,W/2,555);
  T('الصفّ '+gName(S.grade)+' الابتدائي — فصل '+S.cls,620,'700 34px "IBM Plex Sans Arabic"','#5C7377');
  const line='لإتمامه «'+jTitle(J)+'» في تدريبات نافس ضمن مبادرة نُتقن، وحصوله على الدرجة';
  fitText(x,line,W-260,40,700); x.fillStyle='#173A40'; x.textAlign='center'; x.fillText(line,W/2,700);
  T(AR(totalScore(J))+' من '+AR(TOTAL),790,'800 72px "IBM Plex Sans Arabic"','#E8590C');
  B.secs.forEach((s,i)=>{const xx=W/2+(1-i)*440; const n=Math.round(secScore(i)/SECN*3);
    fitText(x,s.name,400,32,800); x.textAlign='center'; x.fillStyle=SC[i].hex; x.fillText(s.name,xx,850);
    x.font='44px "IBM Plex Sans Arabic"'; x.fillStyle='#F5B300'; x.fillText('★'.repeat(n)+'☆'.repeat(3-n),xx,898);});
  T('متمنّين لك دوام التفوّق والنجاح',950,'700 34px "IBM Plex Sans Arabic"','#173A40');
  T('مدير المدرسة',995,'700 28px "IBM Plex Sans Arabic"','#5C7377','center',W-360);
  T('أ. عبدالله يوسف المهناء',1035,'800 30px "IBM Plex Sans Arabic"','#173A40','center',W-360);
  T('منسّق المبادرة – مشرف دعم التميّز المدرسي',995,'700 28px "IBM Plex Sans Arabic"','#5C7377','center',380);
  T('أ. سلطان صالح المبارك',1035,'800 30px "IBM Plex Sans Arabic"','#173A40','center',380);
  return c;
}
async function viewFinal(){
  const B = BANK[J], sc = totalScore(J), pct = Math.round(sc/TOTAL*100);
  const phoneIntl = S.phone ? '966'+S.phone.slice(1) : '';
  const text = `السلام عليكم ورحمة الله،\nأتمّ الطالب ${S.name} (الصفّ ${gName(S.grade)} – فصل ${S.cls}) تدريبات «${jTitle(J)}» لاختبار نافس ضمن مبادرة نُتقن – النشاط الطلابي.\nالدرجة: ${AR(sc)} من ${AR(TOTAL)} (${AR(pct)}٪)\n${B.secs.map((s,i)=>`${s.name}: ${AR(secScore(i))} من ${AR(SECN)}`).join('\n')}\nمدرسة حكيم بن حزام الابتدائية`;
  const wa = 'https://wa.me/'+phoneIntl+'?text='+encodeURIComponent(text);
  const file = 'شهادة-'+jTitle(J).replace(/\s+/g,'-')+'.png';
  app.innerHTML = `
  <div class="card res pop">
    <span class="school">انتهت ${jTitle(J)}!</span>
    <h2 style="font-size:30px">أحسنت يا ${esc(S.name.split(/\s+/)[0])}</h2>
    <div class="big" style="color:var(--s2)">${AR(sc)} / ${AR(TOTAL)}</div>
    <div style="font-weight:700">نسبتك ${AR(pct)}٪</div>
  </div>
  <div class="card bars">${B.secs.map((s,i)=>{const v=secScore(i);return `<div class="bar" style="--c:${SC[i].c}"><span>${esc(s.name)}</span><span class="tr"><i style="width:${v/SECN*100}%"></i></span><span>${AR(v)}/${AR(SECN)}</span></div>`;}).join('')}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h3 style="font-size:22px">شهادتك</h3>
    <img id="cert" alt="شهادة شكر وتقدير باسم الطالب ودرجته">
    <button class="btn wide" id="sv" hidden>احفظ الشهادة في جوالك</button>
    <p class="hint">لحفظ الشهادة: اضغط على الصورة ضغطًا مطوّلًا ثمّ اختر «حفظ الصورة».</p>
  </div>
  <div class="card wa">
    <h3 style="font-size:22px">أرسل درجتك إلى وليّ أمرك</h3>
    ${S.phone?`<a href="${wa}" target="_blank" rel="noopener">إرسال عبر واتساب إلى ${S.phone}</a>`:`<a href="${wa}" target="_blank" rel="noopener">إرسال عبر واتساب</a><p class="hint">لم تكتب رقم وليّ أمرك، فستختار المحادثة بنفسك في واتساب.</p>`}
    <p class="hint">إن لم يفتح واتساب، انسخ الرسالة وأرسلها بنفسك:</p>
    <div class="msg" id="mt">${esc(text)}</div>
    <button class="btn ghost wide" id="cp">نسخ الرسالة</button>
  </div>
  <div class="row"><button class="btn ghost" id="mp">العودة إلى الخريطة</button><button class="btn" id="sb">مادّة أخرى</button></div>
  <button class="btn ghost wide" id="nw">أعد هذه المادّة من البداية</button>`;
  $('#mp').onclick = viewMap;
  $('#sb').onclick = viewSubjects;
  $('#nw').onclick = () => { S.best[J]={}; save(); viewMap(); };
  $('#cp').onclick = async () => { try{ await navigator.clipboard.writeText(text); $('#cp').textContent='نُسخت الرسالة'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('#mt')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); $('#cp').textContent='حدّد النصّ وانسخه'; } };
  window.scrollTo({top:0});
  const canvas = await drawCert();
  $('#cert').src = canvas.toDataURL('image/png');
  const dl = window.claude ? await window.claude.use('downloads').catch(()=>null) : null;
  if(!window.claude){
    $('#sv').hidden = false;
    $('#sv').onclick = () => { const a=document.createElement('a'); a.href=$('#cert').src; a.download=file; document.body.appendChild(a); a.click(); a.remove(); };
  }
  if(dl){
    $('#sv').hidden = false;
    $('#sv').onclick = () => canvas.toBlob(async blob => {
      try{ await dl.save({filename:file, data:blob}); $('#sv').textContent='حُفظت الشهادة'; }
      catch(e){ if(e && (e.code==='unavailable'||e.code==='not_granted')) $('#sv').hidden=true; }
    },'image/png');
  }
}

/* boot */
if(S.name && S.grade && S.cls) viewSubjects(); else viewStart();
</script>
</body></html>
