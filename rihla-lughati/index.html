<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>رحلة لغتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap">
<style>
/* Layout: one centred column (max 560px) — a phone-first game path: start → map of 3 sections × 3 levels → questions → certificate */
:root{
  --bg:#EEF6F4; --surface:#FFFFFF; --ink:#173A40; --muted:#5C7377; --line:#D3E4E1;
  --voc:#0E9384; --voc-soft:#D6F2EE; --comp:#3B5BDB; --comp-soft:#DFE6FF; --op:#E8590C; --op-soft:#FFE4D3;
  --gold:#F5B300; --ok:#2B9A4B; --ok-soft:#DDF5E3; --bad:#D9363E; --bad-soft:#FCE1E2; --lock:#AFC2C0;
  --display:"IBM Plex Sans Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1F22; --surface:#17302F; --ink:#E7F3F1; --muted:#9DB6B3; --line:#28474A;
  --voc:#3CC9B6; --voc-soft:#123E3A; --comp:#8AA2FF; --comp-soft:#1D2A55; --op:#FF9A5C; --op-soft:#4A2614;
  --gold:#FFC93D; --ok:#5CD07D; --ok-soft:#173E24; --bad:#FF7A80; --bad-soft:#4A1C1F; --lock:#4E6865; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1F22; --surface:#17302F; --ink:#E7F3F1; --muted:#9DB6B3; --line:#28474A;
  --voc:#3CC9B6; --voc-soft:#123E3A; --comp:#8AA2FF; --comp-soft:#1D2A55; --op:#FF9A5C; --op-soft:#4A2614;
  --gold:#FFC93D; --ok:#5CD07D; --ok-soft:#173E24; --bad:#FF7A80; --bad-soft:#4A1C1F; --lock:#4E6865; color-scheme:dark}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px}
.btn{border:0;border-radius:16px;padding:14px 20px;font-size:20px;font-weight:700;background:var(--ink);color:var(--bg);font-family:var(--display)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.school{font-size:14px;color:var(--muted);font-weight:700;text-align:center;line-height:1.5}
.badge{align-self:center;background:var(--voc-soft);color:var(--voc);border:1.5px solid var(--voc);border-radius:999px;padding:2px 14px;font-weight:700;font-size:14px}
/* start */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:6px}
.hero h1{font-size:46px;color:var(--ink)}
.hero h1 span{color:var(--voc)}
.hero p{margin:0;color:var(--muted);font-weight:700}
.path{display:flex;gap:8px;justify-content:center;margin:4px 0}
.path i{width:14px;height:14px;border-radius:50%;display:block}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input,.field select{font:inherit;font-size:19px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.field small{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:0}
/* map */
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who b{font-family:var(--display);font-size:22px}
.total{font-weight:700;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.sec{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--c)}
.sec{background:var(--cs)}
.sec header{display:flex;align-items:center;gap:12px}
.sec .ic{width:46px;height:46px;border-radius:14px;background:var(--c);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:700;flex:0 0 auto}
.sec h2{font-size:24px;color:var(--c)}
.sec header p{margin:0;color:var(--muted);font-size:15px;font-weight:700}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv{border:0;border-radius:16px;background:var(--surface);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);border:2px solid transparent}
.lv .n{font-family:var(--display);font-size:26px;font-weight:700;color:var(--c);line-height:1}
.lv .t{font-weight:700;font-size:15px}
.lv .st{font-size:18px;letter-spacing:2px;color:var(--gold);min-height:1.2em}
.lv.next{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.lv.locked{opacity:.55;cursor:not-allowed}.lv.locked .n{color:var(--lock)}
.lv .sc{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qtop .tag{background:var(--c);color:var(--surface);border-radius:999px;padding:4px 14px;font-weight:700;font-family:var(--display)}
.qtop .x{background:none;border:0;color:var(--muted);font-weight:700;font-size:16px}
.dots{display:flex;gap:6px}.dots i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--c)}.dots i.okd{background:var(--ok)}.dots i.badd{background:var(--bad)}
.passage{background:var(--cs);border-radius:18px;padding:12px 16px;border:1.5px dashed var(--c)}
.passage .ph{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--c)}
.passage .ph button{background:none;border:0;color:var(--c);font-weight:700;font-size:15px}
.passage p{margin:6px 0 0;font-size:19px;line-height:1.85}
.passage.closed p{display:none}
.qimg{display:block;margin:0 auto;border-radius:14px;max-height:200px;max-width:100%}
.stem{font-family:var(--display);font-size:25px;font-weight:700;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:20px;font-weight:700;color:var(--ink)}
.opt .l{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--cs);color:var(--c);font-family:var(--display);font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .l{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .l{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:10px 14px;font-weight:700;font-size:19px;text-align:center}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* level result */
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stars{font-size:46px;letter-spacing:6px;color:var(--gold)}
.stars .off{color:var(--line)}
.res .row{width:100%}
/* final */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px 1fr 56px;align-items:center;gap:10px;font-weight:700}
.bar .tr{height:14px;border-radius:99px;background:var(--line);overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar span:last-child{text-align:left;font-variant-numeric:tabular-nums}
#cert{width:100%;border-radius:12px;border:1.5px solid var(--line);display:block}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:0}
.wa{display:flex;flex-direction:column;gap:8px}
.wa a{display:block;text-align:center;text-decoration:none;background:#1FA855;color:#fff;border-radius:16px;padding:14px;font-family:var(--display);font-weight:700;font-size:20px}
.msg{white-space:pre-wrap;background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:420px){.hero h1{font-size:38px}.stem{font-size:22px}.opt{font-size:18px}.bar{grid-template-columns:96px 1fr 48px}}
</style>

<div class="wrap" id="app">
  <section class="hero">
    <div class="school">إدارة التعليم بمحافظة الأحساء<br>مدرسة حكيم بن حزام الابتدائية وملحقتها الطريبيل المتوسطة</div><div class="badge">مبادرة نُتقن – النشاط الطلابي</div>
    <h1>رحلة <span>لغتي</span></h1>
    <p>تدريبات نافس • الصف الثالث الابتدائي</p>
  </section>
  <div class="card"><p class="hint">جارٍ تجهيز الرحلة…</p></div>
</div>

"voc", "stem": "أيُّ جملةٍ من الجملِ التاليةِ تحتوي على استخدامٍ صحيحٍ لكلمةِ (الرُّفوف)؟", "ctx": [], "img": null, "opts": ["الرُّفوفُ تسكنُ في بيتٍ جميلٍ.", "يُحِبُّ الأطفالُ مشاهدةَ الرُّفوفِ في الحديقةِ.", "وضعَ المعلّمُ الكتبَ على الرُّفوفِ بانتظامٍ.", "الرُّفوفُ نوعٌ من الفاكهةِ اللذيذةِ."], "ans": 2, "lvl": 1, "id": 22}, {"sec": "voc", "stem": "الاستخدامُ الصحيحُ لكلمةِ (النَّصائح) هو:", "ctx": [], "img": null, "opts": ["النَّصائحُ كتابٌ يُقرأُ في المكتبةِ.", "النَّصائحُ تُزرَعُ في الحقلِ في فصلِ الصيفِ.", "النَّصائحُ نوعٌ من الألعابِ المفضَّلةِ.", "قدَّمَ الأستاذُ النَّصائحَ للطلّابِ قبلَ الاختبارِ."], "ans": 3, "lvl": 1, "id": 23}, {"sec": "voc", "stem": "جميعُ الكلماتِ التاليةِ تحملُ المعنى نفسَه ما عدا:", "ctx": [], "img": null, "opts": ["جَدِيد", "حَدِيث", "عَصْرِيّ", "قَدِيم"], "ans": 3, "lvl": 1, "id": 24}, {"sec": "voc", "stem": "السياقُ المناسبُ لكلمةِ (المستقبَل) من الجملِ الآتيةِ هو:", "ctx": [], "img": null, "opts": ["العملُ عبادةٌ وهو طريقُ ..........", "أمرَنا اللهُ عزَّ وجلَّ بـ..........", "لا يستطيعُ إنسانٌ واحدٌ استيعابَ جميعِ ..........", "إذا تتبَّعْنا قصصَ الأنبياءِ و.........."], "ans": 0, "lvl": 1, "id": 25}, {"sec": "voc", "stem": "أيٌّ من الكلماتِ التاليةِ تُخالِفُ معنى كلمةِ «مُسرِعًا» كما وردت في النصِّ السابقِ؟", "ctx": ["واجهَ الفريقُ تحدِّياتٍ صعبةً خلالَ الرحلةِ، لكنَّه تغلَّبَ عليها بالتعاونِ والعزيمةِ."], "img": null, "opts": ["مُهَرْوِلًا", "مُنطلِقًا", "مُتعجِّلًا", "بطيئًا"], "ans": 3, "lvl": 1, "id": 26}, {"sec": "voc", "stem": "وردَتْ في العبارةِ السابقةِ كلمةُ (عُمّال)، اخترِ الفئةَ التي تنتمي إليها:", "ctx": ["يؤدّي عُمّالُ النظافةِ دورًا جوهريًّا في الحفاظِ على نظافةِ المدينةِ وجمالِها، ويستحقّونَ كلَّ التقديرِ والاحترامِ."], "img": null, "opts": ["مؤنَّث – فعل – مثنًّى", "مؤنَّث – اسم – مفرد", "مذكَّر – اسم – جمع", "مذكَّر – حرف – مفرد"], "ans": 2, "lvl": 2, "id": 27}, {"sec": "voc", "stem": "أيُّ جملةٍ من الجملِ التاليةِ تحتوي على استخدامٍ صحيحٍ لكلمةِ (الثقافة)؟", "ctx": [], "img": null, "opts": ["يُقدِّمُ الطُّهاةُ الثقافةَ على المائدةِ في العشاءِ.", "الثقافةُ مفتاحُ النجاحِ في الحياةِ.", "تُقدِّمُ المدرسةُ الثقافةَ كلَّ يومٍ في الحديقةِ.", "الثقافةُ اسمُ صديقٍ جديدٍ في المدرسةِ."], "ans": 1, "lvl": 2, "id": 28}, {"sec": "voc", "stem": "كلمتانِ في النصِّ تدلُّ الأولى على مفردٍ والثانيةُ على جمعٍ – على الترتيبِ – هما:", "ctx": ["يُحبُّ الطفلُ القراءةَ في المكتبةِ، حيثُ يجدُ الكثيرَ من الكتبِ المفيدةِ. يجلسُ الطفلُ بهدوءٍ ويقرأُ قصصًا ممتعةً تُساعِدُه على تنميةِ خيالِه ومعرفتِه."], "img": null, "opts": ["الطفل – الكتب", "القصص – الطفل", "الكتب – القصص", "الطفل – المكتبة"], "ans": 0, "lvl": 2, "id": 29}, {"sec": "voc", "stem": "ما المرادفُ الأقربُ لكلمةِ «يُلوِّح» كما وردت في النصِّ؟", "ctx": ["دخلَ الطالبُ ليثٌ إلى الصفِّ مُسرِعًا وهو يُلوِّحُ برسمةٍ ملوَّنةٍ. اقتربَ من المعلّمِ وقالَ بابتسامةٍ: «رسمتُ هذهِ الحديقةَ لأنّي أحبُّ الزهورَ!». تأمَّلَ المعلّمُ الرسمةَ وأومأَ بإعجابٍ، ثُمَّ علَّقَها على السبّورةِ ليراها الجميعُ."], "img": null, "opts": ["يُخفي", "يُشير", "يَصرُخ", "يرسُم"], "ans": 1, "lvl": 2, "id": 30}, {"sec": "voc", "stem": "مرادفُ كلمةِ «حيويّة» في الجملةِ: «حيثُ تُوفِّرُ مواردَ حيويّةً للكائناتِ الحيّةِ» هو:", "ctx": ["تُعَدُّ الأنظمةُ البيئيّةُ المائيّةُ من أهمِّ النُّظُمِ البيئيّةِ على سطحِ الأرضِ، حيثُ تُوفِّرُ مواردَ حيويّةً للكائناتِ الحيّةِ. ولكنْ تُواجِهُ هذهِ الأنظمةُ تحدِّياتٍ كبيرةً مثلَ التلوُّثِ والصيدِ الجائرِ، ممّا يستدعي جهودًا حثيثةً للحفاظِ عليها."], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAECAP4DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtRE ةِ الملكِ عبدِاللهِ للعلومِ والتقنيةِ، ويُعرِّفُ الزوّارَ بتاريخِ العلومِ الإسلاميّةِ وإنجازاتِ العلماءِ الذينَ مهَّدوا الطريقَ لتطوُّرِ العلمِ الحديثِ، كما يُشجِّعُ المتحفُ الطلّابَ والباحثينَ على الابتكارِ والاستكشافِ."], "img": null, "opts": ["مُؤنَّث", "مُثنًّى", "مُذكَّر", "فِعْل"], "ans": 2, "lvl": 2, "id": 33}, {"sec": "voc", "stem": "أيُّ الكلماتِ التاليةِ لا تحملُ معنى كلمةِ «الحفاظ» في السياقِ؟", "ctx": ["«ولكنْ تُواجِهُ هذهِ الأنظمةُ تحدِّياتٍ كبيرةً مثلَ التلوُّثِ والصيدِ الجائرِ، ممّا يستدعي جهودًا حثيثةً للحفاظِ عليها»."], "img": null, "opts": ["العِناية", "التَّخريب", "الدَّعم", "التَّطوير"], "ans": 1, "lvl": 2, "id": 34}, {"sec": "voc", "stem": "العنصرُ الرئيسُ الذي يجمعُ بينَ الأحداثِ في النصِّ هو:", "ctx": ["استيقظَ عليٌّ في صباحِ يومٍ مشمسٍ، وجهّزَ نفسَه للذهابِ إلى المدرسةِ. بعدَ تناولِ وجبةِ الإفطارِ حملَ حقيبتَه وخرجَ مسرعًا. وفي الطريقِ التقى صديقَه أحمدَ، وأخذا يتبادلانِ الحديثَ عن الدروسِ والأنشطةِ المدرسيّةِ. وعندَ وصولِهما إلى المدرسةِ بدأَ الطابورُ الصباحيُّ، ثمّ دخلَ الطلابُ إلى فصولِهم لبدايةِ الحصصِ الدراسيّةِ."], "img": null, "opts": ["لعبةٌ في الساحةِ", "يومٌ دراسيٌّ في حياةِ عليٍّ", "رحلةٌ إلى الحديقةِ", "حفلٌ في المدرسةِ"], "ans": 1, "lvl": 2, "id": 35}, {"sec": "voc", "stem": "ما الجملةُ التي تُعبِّرُ عن معنى (ذبُلَ) كما ورد في النصِّ؟", "ctx": ["كانَتْ قطرةُ ماءٍ في بُحيرةٍ، فتبخَّرَتْ وصعِدَتْ إلى السماءِ. دخلَتِ الغيمةَ، ثُمَّ نزلَتْ مطرًا على زهرةٍ ذبُلَتْ وانحنَتْ أوراقُها شوقًا للحياةِ. شرِبَتِ الزهرةُ الماءَ، ففرِحَتْ وفتحَتْ أوراقَها كأنَّها تبتسمُ للنورِ. ثُمَّ تسلَّلَتِ القطرةُ إلى التربةِ، ووصلَتْ إلى نهرٍ صغيرٍ، وقالَتْ: «أنا مفيدةٌ في كلِّ مكانٍ»."], "img": null, "opts": ["ذبُلَ صوتُ العصفورِ من الحزنِ.", "ذبُلَ جسمُ المريضِ لأنَّه لم يهتمَّ بصحّتِه.", "سهِرَ الطالبُ فذبُلَتْ عينُه.", "ذبُلَتِ النخلةُ الصغيرةُ بعدَ أنْ جفَّتِ السواقي حولَها."], "ans": 3, "lvl": 2, "id": 36}, {"sec": "voc", "stem": "مرادفُ كلمةِ (البواسل) في النصِّ:", "ctx": ["المملكةُ العربيّةُ السعوديّةُ وطنُنا الغالي، ننعمُ فيه بالأمنِ والأمانِ، ويعيشُ فيه الناسُ متعاونينَ متحابّينَ. وقد بذلَ الملكُ المؤسّسُ عبدُالعزيزِ – رحمَه اللهُ – جهودًا كبيرةً في توحيدِ البلادِ وجمعِ كلمةِ أهلِها، حتّى أصبحتْ دولةً قويّةً موحّدةً.", "ويرتفعُ فوقَ رؤوسِنا العلمُ الأخضرُ يحملُ كلمةَ التوحيدِ، فنشعرُ بفخرٍ وعزّةٍ، ويحرسُ جنودُنا البواسلُ حدودَ الوطنِ ليلًا ونهارًا، حتّى ينامَ المواطنونَ في أمانٍ.", "ويحبُّ الطلابُ وطنَهم كثيرًا؛ فيجتهدونَ في دروسِهم، ويحافظونَ على نظافةِ مدرستِهم، ويساعدونَ زملاءَهم، ويحلمونَ أن يصبحوا أطبّاءَ ومعلّمينَ ومهندسينَ يخدمونَ وطنَهم. فحبُّ السعوديّةِ ليسَ كلامًا، بل عملٌ وإخلاصٌ."], "img": null, "opts": ["الشجعان", "الضعفاء", "الكسالى", "الخائفون"], "ans": 0, "lvl": 2, "id": 37}, {"sec": "voc", "stem": "يساعدُ النصُّ الطالبَ على فهمِ معنى «الأدبِ الرياضيِّ» بـ:", "ctx": ["منتخبُنا السعوديُّ فخرُ الوطنِ. يحبُّ أبناءُ المملكةِ العربيّةِ السعوديّةِ لعبةَ كرةِ القدمِ؛ فهي لعبةٌ جميلةٌ تعلّمُنا التعاونَ والإخلاصَ والاجتهادَ. ومنتخبُنا السعوديُّ يمثّلُ وطنَنا في الملاعبِ الدوليّةِ.", "يلعبُ اللاعبونَ بحبٍّ وحماسٍ لرفعِ العلمِ السعوديِّ عاليًا، ونفرحُ جميعًا عندما يحقّقُ المنتخبُ الفوزَ في المبارياتِ، ونشجّعُه بالهتافِ ورفعِ العلمِ فخرًا واعتزازًا.", "ويعلّمُنا اللاعبونَ أن نجتهدَ ونعملَ كفريقٍ واحدٍ، كما يعلّمونَنا الأدبَ الرياضيَّ واحترامَ الفريقِ الآخرِ. فالفوزُ الحقيقيُّ هو أن نكونَ مثالًا في الأخلاقِ والعطاءِ."], "img": null, "opts": ["عرضِ صورٍ عن المبارياتِ", "التركيزِ على الفوزِ فقط", "ذكرِ أمثلةٍ عن تعاونِ اللاعبينَ واحترامِهم للفريقِ الآخرِ", "الحديثِ عن التدريبِ"], "ans": 2, "lvl": 2, "id": 38}, {"sec": "voc", "stem": "نوعُ كلمةِ (الجنود) في النصِّ:", "ctx": ["المملكةُ العربيّةُ السعوديّةُ وطنُنا الغالي، ننعمُ فيه بالأمنِ والأمانِ، ويعيشُ فيه الناسُ متعاونينَ متحابّينَ. وقد بذلَ الملكُ المؤسّسُ عبدُالعزيزِ – رحمَه اللهُ – جهودًا كبيرةً في توحيدِ البلادِ وجمعِ كلمةِ أهلِها، حتّى أصبحتْ دولةً قويّةً موحّدةً.", "ويرتفعُ فوقَ رؤوسِنا العلمُ الأخضرُ يحملُ كلمةَ التوحيدِ، فنشعرُ بفخرٍ وعزّةٍ، ويحرسُ جنودُنا البواسلُ حدودَ الوطنِ ليلًا ونهارًا، حتّى ينامَ المواطنونَ في أمانٍ.", "ويحبُّ الطلابُ وطنَ     <h3 style="font-size:20px">كيف تلعب؟</h3>
    <div>في الرحلة ٣ فقرات: دلالات الألفاظ، وفهم المقروء، وأفكّر وأبدي رأيي، ولكل فقرة ٣ مستويات.</div>
    <div>في كل مستوى ${AR(PER)} أسئلة. بعد كل مستوى يُفتح المستوى الذي بعده.</div>
    <div>في النهاية تحصل على درجتك من ${AR(TOTAL)} وشهادة شكر.</div>
  </div>`;
  $('#f').onsubmit = e => {
    e.preventDefault();
    const nm = $('#nm').value.trim(), cl = $('#cl').value, ph = $('#ph').value.replace(/[^\d٠-٩]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    if(nm.split(/\s+/).length<2){ $('#er').textContent='اكتب اسمك الأوّل واسم أبيك على الأقل.'; $('#nm').focus(); return; }
    if(!cl){ $('#er').textContent='اختر فصلك.'; $('#cl').focus(); return; }
    if(ph && !/^05\d{8}$/.test(ph)){ $('#er').textContent='اكتب رقم الجوال بهذا الشكل: 05xxxxxxxx، أو اتركه فارغًا.'; $('#ph').focus(); return; }
    S.name=nm; S.cls=cl; S.phone=ph; save(); viewMap();
  };
}

/* ---------- map ---------- */
function viewMap(){
  const ni = nextIdx();
  app.innerHTML = `
  <div class="who"><div><div class="school" style="text-align:right">رحلة لغتي</div><b>${esc(S.name.split(/\s+/)[0])}، أهلًا بك!</b></div><span class="total">درجتك: ${AR(totalScore())} / ${AR(TOTAL)}</span></div>
  ${SECS.map((s,si)=>`
  <section class="sec" style="--c:${s.c};--cs:${s.cs}">
    <header><div class="ic">${s.ic}</div><div><h2>${s.name}</h2><p>${s.desc}</p></div></header>
    <div class="levels">${LV.map((l,li)=>{
      const k=s.k+'-'+li, idx=si*3+li, b=S.best[k], locked=idx>ni, isNext=idx===ni;
      return `<button class="lv ${locked?'locked':''} ${isNext?'next':''}" data-k="${k}" ${locked?'disabled aria-disabled="true"':''}>
        <span class="n">${locked?'🔒':AR(li+1)}</span><span class="t">${locked?'المستوى '+AR(li+1):'المستوى'}</span>
        <span class="st">${b!=null?starHTML(starsFor(b)):''}</span>
        <span class="sc">${b!=null?AR(b)+' / '+AR(PER):(isNext?'ابدأ هنا':'')}</span></button>`;}).join('')}</div>
  </section>`).join('')}
  ${ni>=ORDER.length?`<button class="btn wide" id="fin">اعرض شهادتي</button>`:''}
  <button class="btn ghost wide" id="bk">تعديل الاسم والفصل</button>`;
  app.querySelectorAll('.lv:not(.locked)').forEach(b=>b.onclick=()=>startLevel(b.dataset.k));
  $('#bk').onclick = viewStart;
  if($('#fin')) $('#fin').onclick = viewFinal;
}

/* ---------- quiz ---------- */
let Q = null;
function startLevel(k){
  const [sec,lv] = k.split('-');
  const pool = DATA.filter(d=>d.sec===sec && d.lvl===+lv);
  Q = {k, items: shuffle(pool).slice(0,PER).map(d=>{const order=shuffle([0,1,2,3]); return {...d, order};}), i:0, score:0, marks:[]};
  viewQ();
}
function viewQ(){
  const s = secOf(Q.k), it = Q.items[Q.i], lv = +Q.k.split('-')[1];
  const L = ['أ','ب','ج','د'];
  app.innerHTML = `
  <div style="--c:${s.c};--cs:${s.cs};display:flex;flex-direction:column;gap:14px" class="pop">
    <div class="qtop"><span class="tag">${s.name} • ${LV[lv]}</span><button class="x" id="ex">خروج ✕</button></div>
    <div class="dots">${Q.items.map((_,j)=>`<i class="${Q.marks[j]===true?'okd':Q.marks[j]===false?'badd':(j===Q.i?'on':'')}"></i>`).join('')}</div>
    <div class="school" style="text-align:right">السؤال ${AR(Q.i+1)} من ${AR(PER)}</div>
    ${it.ctx.length?`<div class="passage" id="ps"><div class="ph"><span>اقرأ النصّ</span><button id="tg">إخفاء النصّ</button></div>${it.ctx.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`:''}
    ${it.img?`<img class="qimg" src="${it.img}" alt="صورة السؤال">`:''}
    <div class="stem">${esc(it.stem)}</div>
    <div class="opts">${it.order.map((oi,j)=>`<button class="opt" data-oi="${oi}"><span class="l">${L[j]}</span><span>${esc(it.opts[oi])}</span></button>`).join('')}</div>
    <div id="fbx"></div>
  </div>`;
  $('#ex').onclick = viewMap;
  if($('#tg')) $('#tg').onclick = () => { const p=$('#ps'); p.classList.toggle('closed'); $('#tg').textContent = p.classList.contains('closed')?'إظهار النصّ':'إخفاء النصّ'; };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
  window.scrollTo({top:0});
}
const PRAISE = ['أحسنت! إجابة صحيحة.','ممتاز! أنت بطل.','رائع! أجبت إجابة صحيحة.','أحسنت، استمرّ!'];
function answer(oi){
  const it = Q.items[Q.i], ok = oi===it.ans;
  Q.marks[Q.i]=ok; if(ok) Q.score++;
  app.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const v=+b.dataset.oi; if(v===it.ans) b.classList.add('ok'); else if(v===oi) b.classList.add('bad'); });
  const last = Q.i===Q.items.length-1;
  $('#fbx').innerHTML = `<div class="fb ${ok?'ok':'bad'} pop">${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'إجابتك غير صحيحة، والإجابة الصحيحة باللون الأخضر.'}</div>
    <button class="btn wide" id="nx" style="margin-top:10px">${last?'اعرض نتيجة المستوى':'السؤال التالي'}</button>`;
  app.querySelectorAll('.dots i')[Q.i].className = ok?'okd':'badd';
  $('#nx').focus();
  $('#nx').onclick = () => { if(last) finishLevel(); else { Q.i++; viewQ(); } };
}
function finishLevel(){
  const prev = S.best[Q.k]; S.best[Q.k] = Math.max(prev??0, Q.score); save();
  const s = secOf(Q.k), st = starsFor(Q.score), allDone = nextIdx()>=ORDER.length;
  const msg = st===3?'ممتاز! أتقنت هذا المستوى.':st===2?'أحسنت! أداء جميل.':st===1?'جيّد، ويمكنك أن تحاول مرّة أخرى لتحصل على نجوم أكثر.':'لا بأس، أعد المحاولة وستتحسّن.';
  app.innerHTML = `
  <div class="card res pop" style="--c:${s.c};--cs:${s.cs}">
    <span class="school">${s.name} • ${LV[+Q.k.split('-')[1]]}</span>
    <div class="stars">${starHTML(st)}</div>
    <div class="big" style="color:${s.c}">${AR(Q.score)} / ${AR(PER)}</div>
    <div style="font-weight:700;font-size:20px">${msg}</div>
    <div class="row"><button class="btn ghost" id="rt">أعد المستوى</button><button class="btn" id="go">${allDone?'اعرض شهادتي':'تابع الرحلة'}</button></div>
  </div>`;
  $('#rt').onclick = () => startLevel(Q.k);
  $('#go').onclick = () => allDone ? viewFinal() : viewMap();
}

/* ---------- final + certificate ---------- */
function secScore(k){ return [0,1,2].reduce((a,l)=>a+(S.best[k+'-'+l]||0),0); }
function hijri(){ try{ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date()); }catch(e){ return ''; } }
async function drawCert(){
  try{ await Promise.all([document.fonts.load('600 60px "IBM Plex Sans Arabic"'),document.fonts.load('700 30px "IBM Plex Sans Arabic"')]); }catch(e){}
  const W=1600,H=1130, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.direction='rtl';
  x.fillStyle='#FFFDF8'; x.fillRect(0,0,W,H);
  // frame
  x.strokeStyle='#0E9384'; x.lineWidth=18; x.strokeRect(40,40,W-80,H-80);
  x.strokeStyle='#F5B300'; x.lineWidth=5; x.strokeRect(78,78,W-156,H-156);
  // corner dots in the three section colours
  [['#0E9384',59,59],['#3B5BDB',W-59,59],['#E8590C',59,H-59],['#0E9384',W-59,H-59]].forEach(([col,cx,cy])=>{x.fillStyle=col;x.beginPath();x.arc(cx,cy,18,0,7);x.fill();});
  const T=(t,y,font,col,align='center',xx=W/2)=>{x.font=font;x.fillStyle=col;x.textAlign=align;x.fillText(t,xx,y);};
  T('المملكة العربية السعودية • وزارة التعليم',150,'700 30px "IBM Plex Sans Arabic"','#5C7377','right',W-130);
  T('إدارة التعليم بمحافظة الأحساء',192,'700 30px "IBM Plex Sans Arabic"','#5C7377','right',W-130);
  T('مدرسة حكيم بن حزام الابتدائية وملحقتها الطريبيل المتوسطة',234,'700 30px "IBM Plex Sans Arabic"','#5C7377','right',W-130);
  T(hijri(),150,'700 28px "IBM Plex Sans Arabic"','#5C7377','left',130);
  T('مبادرة نُتقن – النشاط الطلابي',192,'800 30px "IBM Plex Sans Arabic"','#0E9384','left',130);
  T('شهادة شكر وتقدير',350,'800 96px "IBM Plex Sans Arabic"','#173A40');
  T('تتقدّم إدارة المدرسة بالشكر والتقدير للطالب',450,'700 40px "IBM Plex Sans Arabic"','#173A40');
  T(S.name,555,'800 76px "IBM Plex Sans Arabic"','#0E9384');
  T('الصفّ الثالث الابتدائي — فصل '+S.cls,620,'700 34px "IBM Plex Sans Arabic"','#5C7377');
  T('لإتمامه «رحلة لغتي» في تدريبات نافس ضمن مبادرة نُتقن، وحصوله على الدرجة',700,'700 40px "IBM Plex Sans Arabic"','#173A40');
  const sc=totalScore();
  T(AR(sc)+' من '+AR(TOTAL),790,'800 72px "IBM Plex Sans Arabic"','#E8590C');
  // section stars
  SECS.forEach((s,i)=>{const xx=W/2+(1-i)*420; const n=Math.round(secScore(s.k)/ (3*PER)*3);
    x.font='800 34px "IBM Plex Sans Arabic"'; x.textAlign='center'; x.fillStyle=['#0E9384','#3B5BDB','#E8590C'][i]; x.fillText(s.name,xx,850);
    x.font='44px "IBM Plex Sans Arabic"'; x.fillStyle='#F5B300'; x.fillText('★'.repeat(n)+'☆'.repeat(3-n),xx,898);});
  T('متمنّين لك دوام التفوّق والنجاح',950,'700 34px "IBM Plex Sans Arabic"','#173A40');
  T('مدير المدرسة',995,'700 28px "IBM Plex Sans Arabic"','#5C7377','center',W-360);
  T('أ. عبدالله يوسف المهناء',1035,'800 30px "IBM Plex Sans Arabic"','#173A40','center',W-360);
  T('منسّق المبادرة – مشرف دعم التميّز المدرسي',995,'700 28px "IBM Plex Sans Arabic"','#5C7377','center',380);
  T('أ. سلطان صالح المبارك',1035,'800 30px "IBM Plex Sans Arabic"','#173A40','center',380);
  return c;
}
async function viewFinal(){
  const sc = totalScore(), pct = Math.round(sc/TOTAL*100);
  const phoneIntl = S.phone ? '966'+S.phone.slice(1) : '';
  const text = `السلام عليكم ورحمة الله،\nأتمّ الطالب ${S.name} (الصفّ الثالث – فصل ${S.cls}) تدريبات «رحلة لغتي» لاختبار نافس ضمن مبادرة نُتقن – النشاط الطلابي.\nالدرجة: ${AR(sc)} من ${AR(TOTAL)} (${AR(pct)}٪)\n${SECS.map(s=>`${s.name}: ${AR(secScore(s.k))} من ${AR(3*PER)}`).join('\n')}\nمدرسة حكيم بن حزام الابتدائية`;
  const wa = 'https://wa.me/'+(phoneIntl)+'?text='+encodeURIComponent(text);
  app.innerHTML = `
  <div class="card res pop">
    <span class="school">انتهت الرحلة!</span>
    <h2 style="font-size:30px">أحسنت يا ${esc(S.name.split(/\s+/)[0])}</h2>
    <div class="big" style="color:var(--op)">${AR(sc)} / ${AR(TOTAL)}</div>
    <div style="font-weight:700">نسبتك ${AR(pct)}٪</div>
  </div>
  <div class="card bars">${SECS.map(s=>{const v=secScore(s.k);return `<div class="bar" style="--c:${s.c}"><span>${s.name}</span><span class="tr"><i style="width:${v/(3*PER)*100}%"></i></span><span>${AR(v)}/${AR(3*PER)}</span></div>`;}).join('')}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h3 style="font-size:22px">شهادتك</h3>
    <img id="cert" alt="شهادة شكر وتقدير باسم الطالب ودرجته">
    <button class="btn wide" id="sv" hidden>احفظ الشهادة في جوالك</button>
    <p class="hint" id="svh">لحفظ الشهادة: اضغط على الصورة ضغطًا مطوّلًا ثمّ اختر «حفظ الصورة».</p>
  </div>
  <div class="card wa">
    <h3 style="font-size:22px">أرسل درجتك إلى وليّ أمرك</h3>
    ${S.phone?`<a href="${wa}" target="_blank" rel="noopener">إرسال عبر واتساب إلى ${S.phone}</a>`:`<a href="${wa}" target="_blank" rel="noopener">إرسال عبر واتساب</a><p class="hint">لم تكتب رقم وليّ أمرك، فستختار المحادثة بنفسك في واتساب.</p>`}
    <p class="hint">إن لم يفتح واتساب، انسخ الرسالة وأرسلها بنفسك:</p>
    <div class="msg" id="mt">${esc(text)}</div>
    <button class="btn ghost wide" id="cp">نسخ الرسالة</button>
  </div>
  <div class="row"><button class="btn ghost" id="mp">العودة إلى الخريطة</button><button class="btn ghost" id="nw">رحلة جديدة</button></div>`;
  $('#mp').onclick = viewMap;
  $('#nw').onclick = () => { S.best={}; save(); viewMap(); };
  $('#cp').onclick = async () => { try{ await navigator.clipboard.writeText(text); $('#cp').textContent='نُسخت الرسالة'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('#mt')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); $('#cp').textContent='حدّد النصّ وانسخه'; } };
  const canvas = await drawCert();
  $('#cert').src = canvas.toDataURL('image/png');
  const dl = window.claude ? await window.claude.use('downloads').catch(()=>null) : null;
  if(!window.claude){
    // standalone site (GitHub Pages): a normal download link works here
    $('#sv').hidden = false;
    $('#sv').onclick = () => { const a=document.createElement('a'); a.href=$('#cert').src; a.download='شهادة-رحلة-لغتي.png'; document.body.appendChild(a); a.click(); a.remove(); };
  }
  if(dl){
    $('#sv').hidden = false;
    $('#sv').onclick = () => canvas.toBlob(async blob => {
      try{ await dl.save({filename:'شهادة-رحلة-لغتي.png', data:blob}); $('#sv').textContent='حُفظت الشهادة'; }
      catch(e){ if(e && (e.code==='unavailable'||e.code==='not_granted')) $('#sv').hidden=true; }
    },'image/png');
  }
}

/* boot */
if(S.name && S.cls) viewMap(); else viewStart();
</script>

</body>
</html>
